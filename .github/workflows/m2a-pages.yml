name: m2a-pages

# Temporary: the pages of the Linux app drawn off screen by the exe of the base of this branch and by the exe of the
# branch, at the scales 1 and 1.5, with the clock fixed by libfaketime, compared byte for byte; and the fingerprints of the
# branch's pages on Ubuntu 24.04 (the FreeType and HarfBuzz of the mac job), to compare with the mac job. Removed before the branch is merged.
on:
  push:
    branches: [agent/mac-m2a]

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install the text libraries and libfaketime, build SDL3, fetch the fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype6 libharfbuzz0b libfontconfig1 fontconfig fonts-droid-fallback faketime
          sudo apt-get install -y --no-install-recommends $(bash tools/linux/build-sdl3.sh --packages)
          bash tools/linux/build-sdl3.sh "$RUNNER_TEMP/sdl3-work" "$RUNNER_TEMP/sdl3"
          bash tools/linux/fetch-fonts.sh "$RUNNER_TEMP/fonts-work" "$RUNNER_TEMP/fonts"

      - name: Publish the base and the branch
        run: |
          base=$(git merge-base HEAD origin/main)
          echo "base: $base, branch: $(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/base-src" && git archive "$base" | tar -x -C "$RUNNER_TEMP/base-src"
          for side in base branch; do
            if [ "$side" = base ]; then src="$RUNNER_TEMP/base-src"; else src="$GITHUB_WORKSPACE"; fi
            dotnet publish "$src/src/Hindsound.Linux/Hindsound.Linux.csproj" -c Release -r linux-x64 --self-contained \
              -p:PublishSingleFile=true -p:PublishTrimmed=true -p:Version=0.10.1 "-p:PublishDir=$RUNNER_TEMP/$side/"
            cp "$RUNNER_TEMP/sdl3/libSDL3.so.0" "$RUNNER_TEMP/$side/"
          done

      - name: Draw the pages with both and compare them
        run: |
          failed=0
          for scale in 1 1.5; do
            for side in base branch; do
              # The same exe path for both: the Hotkeys and first-run pages show the command with the path of the program.
              rm -rf "$RUNNER_TEMP/app" && cp -R "$RUNNER_TEMP/$side" "$RUNNER_TEMP/app"
              run="$RUNNER_TEMP/run-$side-$scale"
              mkdir -p "$run/png"
              printf '%s\n' '{"audio":{"micDeviceId":"disabled"}}' > "$run/settings.json"
              code=0
              FAKETIME_DONT_FAKE_MONOTONIC=1 HINDSOUND_FONT_DIR="$RUNNER_TEMP/fonts" SDL_VIDEO_DRIVER=offscreen \
                timeout 300 faketime -f "@2026-11-21 12:00:00" "$RUNNER_TEMP/app/hindsound" \
                --settings "$run/settings.json" --no-mic --no-clipboard --no-hotkeys --offscreen \
                --dump-settings "$run/png" --scale "$scale" || code=$?
              echo "$side at $scale: exit code $code, $(ls "$run/png" | grep -c '\.png$') PNG files"
              [ "$code" -eq 0 ] || failed=1
              grep -i "window" "$run/settings.log" | head -3 || true
            done
            a="$RUNNER_TEMP/run-base-$scale/png"
            b="$RUNNER_TEMP/run-branch-$scale/png"
            count=$(ls "$a" | grep -c '\.png$')
            if [ "$count" -gt 0 ] && diff -r "$a" "$b"; then
              echo "scale $scale: the $count PNG files of the base and of the branch are identical byte for byte"
              (cd "$a" && sha256sum *.png | sha256sum | sed "s/^/scale $scale: digest of the list: /")
            else
              echo "scale $scale: the pages differ"
              failed=1
            fi
          done
          exit $failed

  prints:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install the text libraries, build SDL3, fetch the fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype6 libharfbuzz0b libfontconfig1 fontconfig fonts-droid-fallback
          dpkg-query -W libfreetype6 libharfbuzz0b
          sudo apt-get install -y --no-install-recommends $(bash tools/linux/build-sdl3.sh --packages)
          bash tools/linux/build-sdl3.sh "$RUNNER_TEMP/sdl3-work" "$RUNNER_TEMP/sdl3"
          bash tools/linux/fetch-fonts.sh "$RUNNER_TEMP/fonts-work" "$RUNNER_TEMP/fonts"

      - name: Draw the pages of the branch and print their fingerprints
        run: |
          dotnet publish src/Hindsound.Linux/Hindsound.Linux.csproj -c Release -r linux-x64 --self-contained \
            -p:PublishSingleFile=true -p:PublishTrimmed=true -p:Version=0.10.1 "-p:PublishDir=$RUNNER_TEMP/branch/"
          cp "$RUNNER_TEMP/sdl3/libSDL3.so.0" "$RUNNER_TEMP/branch/"
          for scale in 1 1.5; do
            run="$RUNNER_TEMP/run-$scale"
            mkdir -p "$run/png"
            printf '%s\n' '{"audio":{"micDeviceId":"disabled"}}' > "$run/settings.json"
            HINDSOUND_FONT_DIR="$RUNNER_TEMP/fonts" SDL_VIDEO_DRIVER=offscreen timeout 300 "$RUNNER_TEMP/branch/hindsound" \
              --settings "$run/settings.json" --no-mic --no-clipboard --no-hotkeys --offscreen \
              --dump-settings "$run/png" --scale "$scale"
            (cd "$run/png" && sha256sum *.png | sed "s/^/page $scale /")
          done
