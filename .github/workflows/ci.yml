name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Hindsound.slnx -c Release

      # A hosted runner has no audio device, hence the filter; the tests that need Linux itself run in the job below.
      # It is also a shared machine: the tests that measure allocations or hold a real-time pace can be sensitive to its
      # load. Rerun before suspecting the code, and look at the test that failed if it fails twice.
      - name: Test
        run: dotnet test Hindsound.slnx -c Release --no-build --filter "Category!=Device&Category!=Linux"

      - name: Test the release scripts
        run: ./tools/release/test-release-scripts.ps1

  # Hindsound.Core calls no Windows API: its own tests run on Linux as well, so that nothing of Windows creeps into it.
  # The Linux app is built and tested here too, inside a session bus of its own (dbus-run-session) with a sound server
  # whose default output is a null sink: the tests marked Category=Linux run only here.
  core-on-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # libx11-6: the keysym table of the shortcuts is checked against libX11's own names (no X server is needed for it).
      - name: Install a sound server and a session bus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus pulseaudio pulseaudio-utils libx11-6

      # audio steps
      # The capture loads libpulse.so.0 by that name (src/Hindsound.Linux/Audio/PulseNative.cs); pulseaudio-utils brings
      # it, with the paplay and pactl the capture tests play their tone with.
      - name: Check the sound library and tools of the capture tests
        run: |
          ldconfig -p | grep -F 'libpulse.so.0'
          command -v paplay pactl

      # lame steps
      # LAME 3.100 from the archive the Windows DLL is built from (same SHA-256), for the MP3 tests of the Linux app: they
      # encode a tone with the library and decode it with the lame command built here, and look for the pitch.
      - name: Build LAME for Linux
        run: |
          sudo apt-get install -y --no-install-recommends build-essential curl file binutils
          ./tools/release/build-lame-linux.sh "$RUNNER_TEMP/lame-work" "$RUNNER_TEMP/lame-linux"
          echo "HINDSOUND_LAME_DIR=$RUNNER_TEMP/lame-linux" >> "$GITHUB_ENV"

      - name: Build
        run: |
          dotnet build tests/Hindsound.Core.Tests/Hindsound.Core.Tests.csproj -c Release
          dotnet build tests/Hindsound.Linux.Tests/Hindsound.Linux.Tests.csproj -c Release

      # One session bus and one sound server for both projects. No "set -e": a failing project must not hide the other, so
      # each result is kept and the step fails at the end if either failed. The sound server writes its log to a file, kept
      # as an artifact when the step fails.
      - name: Test the portable code and the Linux app
        env:
          PULSE_LOG: ${{ runner.temp }}/pulseaudio.log
        run: |
          dbus-run-session -- bash -uc '
            failed=0
            pulseaudio --daemonize=yes --exit-idle-time=-1 --log-target="file:$PULSE_LOG" --log-level=info || failed=1
            for attempt in $(seq 1 20); do pactl info > /dev/null 2>&1 && break; sleep 0.5; done
            pactl load-module module-null-sink sink_name=hindsound_null || failed=1
            pactl set-default-sink hindsound_null || failed=1
            for project in Hindsound.Core.Tests Hindsound.Linux.Tests; do
              echo "::group::$project"
              dotnet test "tests/$project/$project.csproj" -c Release --no-build --filter "Category!=Device" || failed=1
              echo "::endgroup::"
            done
            exit $failed
          '

      - name: Keep the log of the sound server
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulseaudio-log
          path: ${{ runner.temp }}/pulseaudio.log
          if-no-files-found: warn

  # Until a release builds them, the files of the rehearsal below carry the version of the latest release in the changelog.
  release-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          version=$(grep -m 1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # A rehearsal of the release, with nothing published: every file a tag would attach (the Setup, the portable zip, the
  # AppImage, the tar.gz, the manifests, SHA256SUMS, the LAME source and the source of libfuse and of the AppImage
  # runtime), built and checked by the very workflow the tag runs, and kept as artifacts of the run:
  # hindsound-windows-x64, hindsound-linux-x64 and release-files.
  release-files:
    needs: release-version
    uses: ./.github/workflows/release-files.yml
    with:
      version: ${{ needs.release-version.outputs.version }}
