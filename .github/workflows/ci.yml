name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Hindsound.slnx -c Release

      # A hosted runner has no audio device, hence the filter; the tests that need Linux or macOS itself run in the jobs below.
      # It is also a shared machine: the tests that measure allocations or hold a real-time pace can be sensitive to its
      # load. Rerun before suspecting the code, and look at the test that failed if it fails twice.
      - name: Test
        run: dotnet test Hindsound.slnx -c Release --no-build --filter "Category!=Device&Category!=Linux&Category!=Mac"

      - name: Test the release scripts
        run: ./tools/release/test-release-scripts.ps1

  # Hindsound.Core calls no Windows API: its own tests run on Linux as well, so that nothing of Windows creeps into it.
  # The Linux app is built and tested here too, inside a session bus of its own (dbus-run-session) with a sound server
  # whose default output is a null sink: the tests marked Category=Linux run only here.
  core-on-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # libx11-6: the keysym table of the shortcuts is checked against libX11's own names (no X server is needed for it).
      - name: Install a sound server and a session bus
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus pulseaudio pulseaudio-utils libx11-6

      # audio steps
      # The capture loads libpulse.so.0 by that name (src/Hindsound.Linux/Audio/PulseNative.cs); pulseaudio-utils brings
      # it, with the paplay and pactl the capture tests play their tone with.
      - name: Check the sound library and tools of the capture tests
        run: |
          ldconfig -p | grep -F 'libpulse.so.0'
          command -v paplay pactl

      # lame steps
      # LAME 3.100 from the archive the Windows DLL is built from (same SHA-256), for the MP3 tests of the Linux app: they
      # encode a tone with the library and decode it with the lame command built here, and look for the pitch.
      - name: Build LAME for Linux
        run: |
          sudo apt-get install -y --no-install-recommends build-essential curl file binutils
          ./tools/release/build-lame-linux.sh "$RUNNER_TEMP/lame-work" "$RUNNER_TEMP/lame-linux"
          echo "HINDSOUND_LAME_DIR=$RUNNER_TEMP/lame-linux" >> "$GITHUB_ENV"

      # window steps
      # The text of the window takes FreeType, HarfBuzz and fontconfig from the system, as on a desktop. fonts-droid-fallback
      # is a small font with Chinese, Japanese and Korean glyphs: a character the shipped fonts lack is found through it.
      - name: Install the text libraries of the window
        run: |
          sudo apt-get install -y --no-install-recommends libfreetype6 libharfbuzz0b libfontconfig1 fontconfig fonts-droid-fallback
          fc-list :lang=ja family | grep .

      - name: Name the system for the caches
        id: system
        run: echo "id=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

      # SDL3 has no package on Ubuntu: built from its pinned source by the script the release uses, and kept in a cache
      # keyed by the system and the script, which holds the version, the hash and every option.
      - name: Restore SDL3
        id: sdl3-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sdl3
          key: sdl3-${{ steps.system.outputs.id }}-${{ hashFiles('tools/linux/build-sdl3.sh') }}

      - name: Build SDL3
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends $(bash tools/linux/build-sdl3.sh --packages)
          bash tools/linux/build-sdl3.sh "$RUNNER_TEMP/sdl3-work" "$RUNNER_TEMP/sdl3"

      # The app looks for libSDL3.so.0 next to itself, then asks the system: the tests find it in the system's search path.
      - name: Make SDL3 loadable by the tests
        run: |
          bash tools/linux/build-sdl3.sh --check "$RUNNER_TEMP/sdl3"
          sudo install -m 644 "$RUNNER_TEMP/sdl3/libSDL3.so.0" /usr/local/lib/libSDL3.so.0
          sudo ldconfig
          ldconfig -p | grep -F 'libSDL3.so.0'

      - name: Restore the fonts of the window
        id: fonts-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fonts
          key: fonts-${{ hashFiles('tools/linux/fetch-fonts.sh') }}

      - name: Fetch the fonts of the window
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: bash tools/linux/fetch-fonts.sh "$RUNNER_TEMP/fonts-work" "$RUNNER_TEMP/fonts"

      - name: Point the tests at the fonts
        run: |
          bash tools/linux/fetch-fonts.sh --check "$RUNNER_TEMP/fonts"
          echo "HINDSOUND_FONT_DIR=$RUNNER_TEMP/fonts" >> "$GITHUB_ENV"

      - name: Build
        run: |
          dotnet build src/Hindsound.Linux/Hindsound.Linux.csproj -c Release
          dotnet build tests/Hindsound.Core.Tests/Hindsound.Core.Tests.csproj -c Release
          dotnet build tests/Hindsound.Linux.Tests/Hindsound.Linux.Tests.csproj -c Release
          dotnet build tests/Hindsound.Mac.Tests/Hindsound.Mac.Tests.csproj -c Release

      # One session bus and one sound server for the three projects (those of the Mac app that need no macOS run here too,
      # as on Windows). No "set -e": a failing project must not hide the others, so
      # each result is kept and the step fails at the end if either failed. The sound server writes its log to a file, kept
      # as an artifact when the step fails.
      # Then the app itself, in the same session: it draws every page of its window into PNG files (--dump-settings), kept
      # as the artifact linux-dump, and opens its window on SDL's offscreen driver (--settings-probe); see dump-window.sh.
      - name: Test the portable code and the Linux app
        env:
          PULSE_LOG: ${{ runner.temp }}/pulseaudio.log
          DUMP_DIR: ${{ runner.temp }}/linux-dump
        run: |
          dbus-run-session -- bash -uc '
            failed=0
            pulseaudio --daemonize=yes --exit-idle-time=-1 --log-target="file:$PULSE_LOG" --log-level=info || failed=1
            for attempt in $(seq 1 20); do pactl info > /dev/null 2>&1 && break; sleep 0.5; done
            pactl load-module module-null-sink sink_name=hindsound_null || failed=1
            pactl set-default-sink hindsound_null || failed=1
            for run in "Hindsound.Core.Tests|Category!=Device" "Hindsound.Linux.Tests|Category!=Device"                        "Hindsound.Mac.Tests|Category!=Device&Category!=Mac"; do
              project="${run%%|*}"
              echo "::group::$project"
              dotnet test "tests/$project/$project.csproj" -c Release --no-build --filter "${run#*|}" || failed=1
              echo "::endgroup::"
            done
            echo "::group::The window of the app"
            bash tools/linux/dump-window.sh "$DUMP_DIR" "$RUNNER_TEMP/linux-dump-work" \
              src/Hindsound.Linux/bin/Release/net10.0/hindsound || failed=1
            echo "::endgroup::"
            exit $failed
          '

      - name: Keep the log of the sound server
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pulseaudio-log
          path: ${{ runner.temp }}/pulseaudio.log
          if-no-files-found: warn

      # The pages as the Linux app draws them, with the logs of both runs, to compare with those of Windows.
      - name: Keep the pages of the window
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-dump
          path: ${{ runner.temp }}/linux-dump/
          if-no-files-found: warn

  # The macOS app on Apple silicon (macos-26): its native libraries built from pinned sources (and cached), the tests of the
  # portable code, of the code Linux and macOS share (those of Hindsound.Linux.Tests that need no Linux) and of the Mac app;
  # then Hindsound.app, assembled and signed ad hoc, draws every page of its window off screen at the scales 1 and 1.5 and
  # proves its MP3. The fingerprints of the pages are printed, to compare with those of Linux.
  mac:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore the native libraries
        id: natives-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/natives
          key: natives-sums-macos-arm64-${{ hashFiles('tools/mac/build-natives.sh', 'tools/release/lame-exports.txt') }}

      # The SHA-256 of each dylib is written next to them when they are built, and checked when a cache gives them back: a
      # file damaged or changed in the cache stops the job before anything loads it.
      - name: Build the native libraries
        if: steps.natives-cache.outputs.cache-hit != 'true'
        run: |
          bash tools/mac/build-natives.sh "$RUNNER_TEMP/natives-work" "$RUNNER_TEMP/natives"
          (cd "$RUNNER_TEMP/natives" && shasum -a 256 *.dylib > SHA256SUMS)

      - name: Check the native libraries
        run: |
          (cd "$RUNNER_TEMP/natives" && shasum -a 256 -c SHA256SUMS)
          bash tools/mac/build-natives.sh --check "$RUNNER_TEMP/natives"

      # The font script of Linux calls sha256sum, which macOS may not have: the same digest through shasum.
      - name: Give the font script a sha256sum
        run: |
          if ! command -v sha256sum > /dev/null; then
            mkdir -p "$RUNNER_TEMP/bin"
            printf '#!/bin/sh\nexec shasum -a 256 "$@"\n' > "$RUNNER_TEMP/bin/sha256sum"
            chmod +x "$RUNNER_TEMP/bin/sha256sum"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Restore the fonts of the window
        id: fonts-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fonts
          key: fonts-macos-${{ hashFiles('tools/linux/fetch-fonts.sh') }}

      - name: Fetch the fonts of the window
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: bash tools/linux/fetch-fonts.sh "$RUNNER_TEMP/fonts-work" "$RUNNER_TEMP/fonts"

      - name: Check the fonts
        run: bash tools/linux/fetch-fonts.sh --check "$RUNNER_TEMP/fonts"

      - name: Build
        id: build
        run: |
          dotnet build src/Hindsound.Mac/Hindsound.Mac.csproj -c Release
          dotnet build tests/Hindsound.Core.Tests/Hindsound.Core.Tests.csproj -c Release
          dotnet build tests/Hindsound.Linux.Tests/Hindsound.Linux.Tests.csproj -c Release
          dotnet build tests/Hindsound.Mac.Tests/Hindsound.Mac.Tests.csproj -c Release

      # The tests of the Mac load the dylibs next to them, as the app does outside a bundle, and the fonts from
      # HINDSOUND_FONT_DIR. No "set -e": a failing project must not hide the others.
      - name: Test
        env:
          HINDSOUND_FONT_DIR: ${{ runner.temp }}/fonts
        run: |
          cp "$RUNNER_TEMP"/natives/*.dylib tests/Hindsound.Mac.Tests/bin/Release/net10.0/
          failed=0
          for run in "Hindsound.Core.Tests|Category!=Device" "Hindsound.Linux.Tests|Category!=Device&Category!=Linux" \
                     "Hindsound.Mac.Tests|Category!=Device"; do
            project="${run%%|*}"
            echo "::group::$project"
            dotnet test "tests/$project/$project.csproj" -c Release --no-build --filter "${run#*|}" || failed=1
            echo "::endgroup::"
          done
          exit $failed

      # The desktop parts on the runner's own session, their measures printed: a file on the pasteboard and read back, a
      # file sent to the Trash and found in ~/.Trash, the login entry written, read back and removed, the Finder asked to
      # reveal a file, the screens read. Already run by the step above; here again for their lines in the log.
      - name: Prove the desktop parts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet test tests/Hindsound.Mac.Tests/Hindsound.Mac.Tests.csproj -c Release --no-build             --filter "FullyQualifiedName~Hindsound.Mac.Tests.Desktop.MacDesktopProofs" --logger "console;verbosity=detailed"

      # The bundle and its pages even when a test failed: the job fails all the same, and one run shows every problem.
      - name: Assemble Hindsound.app
        id: assemble
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          version=$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md | head -n 1)
          bash packaging/mac/build-app.sh "$RUNNER_TEMP/natives" "$RUNNER_TEMP/fonts" "$RUNNER_TEMP/app" "$version"

      # Each check that check-zip.sh makes of the bundle and its Info.plist refuses a bundle without what it checks: a copy
      # of the bundle with one thing taken out, zipped as the release zips it, must fail on the line that names that thing.
      # The checks stop at the first missing thing, before the app is started: each case takes a few seconds. The bundle
      # as built passes them in the job macos of release-files.yml.
      - name: Show that check-zip.sh refuses a bundle with something missing
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          app="$RUNNER_TEMP/app/Hindsound.app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          failed=0
          no_nlayer() { rm "$1/Contents/Resources/licenses/linux/NLayer-LICENSE.txt"; }
          no_icon() { rm "$1/Contents/Resources/Hindsound.icns"; }
          no_icon_key() { /usr/libexec/PlistBuddy -c 'Delete :CFBundleIconFile' "$1/Contents/Info.plist"; }
          no_mic_text() { /usr/libexec/PlistBuddy -c 'Delete :NSMicrophoneUsageDescription' "$1/Contents/Info.plist"; }
          no_audio_text() { /usr/libexec/PlistBuddy -c 'Delete :NSAudioCaptureUsageDescription' "$1/Contents/Info.plist"; }
          other_minimum() { /usr/libexec/PlistBuddy -c 'Set :LSMinimumSystemVersion 13.0' "$1/Contents/Info.plist"; }
          refused() { # mutation expected-line
            local dir="$RUNNER_TEMP/zip-mutation/$1"
            rm -rf "$dir"
            mkdir -p "$dir/app"
            ditto "$app" "$dir/app/Hindsound.app"
            "$1" "$dir/app/Hindsound.app"
            ditto -c -k --norsrc --noextattr --noqtn --keepParent "$dir/app/Hindsound.app" "$dir/Hindsound-$version-macos-arm64.zip"
            if bash packaging/mac/check-zip.sh "$dir/Hindsound-$version-macos-arm64.zip" "$version" "$dir/check" > "$dir/out" 2>&1; then
              echo "check-zip mutation: $1 passed: NOT CAUGHT"
              failed=1
            elif grep -qF "$2" "$dir/out"; then
              echo "check-zip mutation: $1 refused: $(grep -F "$2" "$dir/out" | head -n 1)"
            else
              echo "check-zip mutation: $1 refused for another reason:"
              tail -n 5 "$dir/out"
              failed=1
            fi
          }
          refused no_nlayer 'the bundle has no Contents/Resources/licenses/linux/NLayer-LICENSE.txt'
          refused no_icon 'the bundle has no Contents/Resources/Hindsound.icns'
          refused no_icon_key 'the Info.plist does not name the icon Hindsound'
          refused no_mic_text 'the Info.plist has no NSMicrophoneUsageDescription'
          refused no_audio_text 'the Info.plist has no NSAudioCaptureUsageDescription'
          refused other_minimum 'the Info.plist does not give macOS 14.4 as the minimum'
          exit $failed

      # The app of the bundle, with its own dylibs and fonts (no HINDSOUND_FONT_DIR), settings of its own in which the
      # microphone is disabled, and every option that keeps it from touching the runner's session.
      - name: Draw the pages and prove the MP3 with the app
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        env:
          OUT: ${{ runner.temp }}/mac-dump
        run: |
          program="$RUNNER_TEMP/app/Hindsound.app/Contents/MacOS/hindsound"
          failed=0
          for scale in 1 1.5; do
            folder="$RUNNER_TEMP/mac-run-$scale"
            mkdir -p "$folder" "$OUT/$scale"
            printf '%s\n' '{"audio":{"micDeviceId":"disabled"}}' > "$folder/settings.json"
            code=0
            SDL_VIDEO_DRIVER=offscreen perl -e 'alarm shift; exec @ARGV' 300 "$program" --settings "$folder/settings.json" --no-mic --no-clipboard \
              --no-hotkeys --offscreen --dump-settings "$OUT/$scale" --scale "$scale" || code=$?
            sed "s/^/  log $scale: /" "$folder/settings.log" || true
            count=$(find "$OUT/$scale" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')
            echo "scale $scale: exit code $code, $count PNG files"
            [ "$code" -eq 0 ] && [ "$count" -gt 0 ] || failed=1
            (cd "$OUT/$scale" && shasum -a 256 *.png | sed "s/^/page $scale /")
          done
          mkdir -p "$RUNNER_TEMP/mac-mp3"
          printf '%s\n' '{"audio":{"micDeviceId":"disabled"}}' > "$RUNNER_TEMP/mac-mp3/settings.json"
          code=0
          perl -e 'alarm shift; exec @ARGV' 120 "$program" --settings "$RUNNER_TEMP/mac-mp3/settings.json" --no-mic --no-clipboard --no-hotkeys \
            --offscreen --prove-mp3 "$RUNNER_TEMP/mac-mp3/out" || code=$?
          sed 's/^/  log mp3: /' "$RUNNER_TEMP/mac-mp3/settings.log" || true
          echo "prove-mp3: exit code $code"
          [ "$code" -eq 0 ] || failed=1
          exit $failed

      # The loop of the app on the main thread, with the session of the runner: the icon of the menu bar and its menu read
      # back from AppKit, a Carbon shortcut registered and its press sent, then a real press posted as a keyboard would (with
      # the PostEvent and Accessibility rights written in TCC for the bundle, as the probe wrote its rights; reported apart),
      # and "hindsound --save" from a second launch received by the running one.
      - name: Prove the loop, the icon, the shortcut and --save with the app
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          app="$RUNNER_TEMP/app/Hindsound.app"
          program="$app/Contents/MacOS/hindsound"
          folder="$RUNNER_TEMP/mac-loop"
          mkdir -p "$folder"
          printf '%s\n' '{"audio":{"micDeviceId":"disabled"}}' > "$folder/settings.json"
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^#* *designated => //p' | head -n 1)
          echo "designated requirement: $requirement"
          if csreq -r "=$requirement" -b "$folder/csreq.bin"; then
            hex=$(xxd -p "$folder/csreq.bin" | tr -d '\n')
            for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
              for service in kTCCServicePostEvent kTCCServiceAccessibility; do
                sudo sqlite3 "$db" "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, flags, last_modified) values ('$service', 'io.github.quelquun667.hindsound', 0, 2, 3, 1, X'$hex', 0, CAST(strftime('%s','now') AS INTEGER));"                   && echo "tcc: $service written in $db" || echo "tcc: $service not written in $db"
              done
            done
            sudo killall tccd || true
          fi
          perl -e 'alarm shift; exec @ARGV' 150 "$program" --settings "$folder/settings.json" --no-mic --no-clipboard --prove-loop > "$folder/proof.out" 2>&1 &
          proof=$!
          for attempt in $(seq 1 120); do
            grep -q "loop proof: ready, waiting for --save" "$folder/settings.log" 2> /dev/null && break
            sleep 0.5
          done
          code=0
          perl -e 'alarm shift; exec @ARGV' 30 "$program" --settings "$folder/settings.json" --save || code=$?
          echo "--save from a second launch: exit code $code (2: handed to the running instance)"
          proof_code=0
          wait "$proof" || proof_code=$?
          echo "--prove-loop: exit code $proof_code"
          cat "$folder/proof.out" || true
          sed 's/^/  log loop: /' "$folder/settings.log" || true
          [ "$code" -eq 2 ] && [ "$proof_code" -eq 0 ] && grep -q "loop proof: result pass" "$folder/settings.log"

      # A real notification through SDL's Cocoa window, not the offscreen driver. The app says when it is up and where, and
      # holds it; screencapture takes the main screen, and the pixels of the accent (its bars) are counted where it is. The
      # app itself checks that the app in front stayed in front and that its window never had the focus, then clicks it with
      # a mouse event of the system (reported, the runner may drop it) and lets it go.
      - name: Show a notification with the app
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          program="$RUNNER_TEMP/app/Hindsound.app/Contents/MacOS/hindsound"
          proof="$RUNNER_TEMP/mac-notification"
          mkdir -p "$proof"
          perl -e 'alarm shift; exec @ARGV' 200 "$program" --prove-notification "$proof/out" > "$proof/console.txt" 2>&1 &
          app=$!
          for _ in $(seq 1 120); do
            [ -f "$proof/out/ready" ] && break
            kill -0 "$app" 2> /dev/null || break
            sleep 0.5
          done
          failed=0
          if [ -f "$proof/out/ready" ]; then
            echo "front app seen from bash: $(lsappinfo info -only name "$(lsappinfo front)" 2>&1 | tr '\n' ' ')"
            screencapture -x -m "$proof/screen.png" || failed=1
            sips -s format bmp "$proof/screen.png" --out "$proof/screen.bmp" > /dev/null || failed=1
            python3 - "$proof/out/ready" "$proof/screen.bmp" <<'EOF' || failed=1
          import struct, sys
          ready = dict(line.strip().split('=', 1) for line in open(sys.argv[1]) if '=' in line)
          data = open(sys.argv[2], 'rb').read()
          offset = struct.unpack_from('<I', data, 10)[0]
          width, height = struct.unpack_from('<ii', data, 18)
          bpp, compression = struct.unpack_from('<HI', data, 28)
          top_down, height, step = height < 0, abs(height), bpp // 8
          stride = (width * step + 3) & ~3
          if compression in (3, 6):
              masks = struct.unpack_from('<III', data, 54)
          else:
              masks = (0xFF0000, 0x00FF00, 0x0000FF)
          shifts = [(m & -m).bit_length() - 1 for m in masks]
          def pixel(x, y):
              i = offset + (y if top_down else height - 1 - y) * stride + x * step
              value = int.from_bytes(data[i:i + step], 'little')
              return tuple((value & m) >> s for m, s in zip(masks, shifts))
          accent = int(ready['accent'], 16)
          target = ((accent >> 16) & 255, (accent >> 8) & 255, accent & 255)
          near = lambda p: all(abs(p[c] - target[c]) <= 24 for c in range(3))
          factor = width / int(ready['screen_w'])
          x, y, w, h = (int(ready[k]) for k in ('x', 'y', 'w', 'h'))
          x0, y0, x1, y1 = int(x * factor), int(y * factor), int((x + w) * factor), int((y + h) * factor)
          inside = sum(1 for py in range(max(0, y0), min(height, y1)) for px in range(max(0, x0), min(width, x1)) if near(pixel(px, py)))
          everywhere = sum(1 for py in range(height) for px in range(width) if near(pixel(px, py)))
          expected = int(ready['expected']) * (factor / float(ready['scale'])) ** 2
          print(f"notification pixels: screen {width}x{height} bpp={bpp} factor={factor} rect=({x0},{y0})-({x1},{y1}) "
                f"accent_inside={inside} accent_elsewhere={everywhere - inside} expected={expected:.0f}")
          print(f"notification pixels: stripe {pixel(min(width - 1, x1 - 1), (y0 + y1) // 2)} fill {pixel((x0 + x1) // 2, y0 + int(4 * factor))}")
          sys.exit(0 if inside >= 0.8 * expected and inside > 100 else 1)
          EOF
          else
            echo "the notification never said it was up"
            failed=1
          fi
          touch "$proof/out/captured"
          code=0
          wait "$app" || code=$?
          sed 's/^/  /' "$proof/console.txt"
          echo "prove-notification: exit code $code"
          [ "$code" -eq 0 ] || failed=1
          exit $failed

      # The lists of the settings and the watch of the devices, on the HAL of the runner with BlackHole 2ch installed (the
      # probe's way: brew, then coreaudiod started again so it loads the driver). The app reads the process list (itself,
      # named after its bundle, and its parent) and the devices, then waits for the watch to see the default output that
      # SwitchAudioSource changes, then for afplay (a tone of 1 kHz for 3 s) to be in the list of the applications that play
      # and to leave it when it ends. The app opens no device: no right of TCC is asked, so none is written.
      - name: Prove the devices and the applications that play with the app
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          sleep 3
          echo "outputs: $(SwitchAudioSource -a -t output | tr '\n' '|')"
          echo "inputs: $(SwitchAudioSource -a -t input | tr '\n' '|')"
          program="$RUNNER_TEMP/app/Hindsound.app/Contents/MacOS/hindsound"
          proof="$RUNNER_TEMP/mac-devices"
          mkdir -p "$proof"
          python3 - "$proof/tone.wav" <<'EOF'
          import math, struct, sys, wave
          with wave.open(sys.argv[1], 'wb') as out:
              out.setnchannels(2)
              out.setsampwidth(2)
              out.setframerate(48000)
              frames = (int(16384 * math.sin(2 * math.pi * 1000 * i / 48000)) for i in range(3 * 48000))
              out.writeframes(b''.join(struct.pack('<hh', v, v) for v in frames))
          EOF
          perl -e 'alarm shift; exec @ARGV' 150 "$program" --prove-devices "$proof/out" > "$proof/console.txt" 2>&1 &
          app=$!
          failed=0
          for _ in $(seq 1 120); do
            [ -f "$proof/out/ready-switch" ] && break
            kill -0 "$app" 2> /dev/null || break
            sleep 0.5
          done
          if [ -f "$proof/out/ready-switch" ]; then
            current=$(SwitchAudioSource -c -t output)
            other=$(SwitchAudioSource -a -t output | grep -vxF "$current" | head -n 1)
            echo "switch: default output '$current' -> '$other'"
            SwitchAudioSource -t output -s "$other" || failed=1
          else
            echo "the app never said it was ready for the switch"
            failed=1
          fi
          for _ in $(seq 1 120); do
            [ -f "$proof/out/ready-play" ] && break
            kill -0 "$app" 2> /dev/null || break
            sleep 0.5
          done
          if [ -f "$proof/out/ready-play" ]; then
            echo "afplay: started by the shell $$"
            perl -e 'alarm shift; exec @ARGV' 30 afplay "$proof/tone.wav" || failed=1
            echo "afplay: ended"
          else
            echo "the app never said it was ready for afplay"
            failed=1
          fi
          code=0
          wait "$app" || code=$?
          sed 's/^/  /' "$proof/console.txt"
          echo "prove-devices: exit code $code"
          [ "$code" -eq 0 ] || failed=1
          if [ "$failed" -ne 0 ]; then
            sudo killall coreaudiod || true
          fi
          exit $failed
      # The capture with real sound, as the probe of M0 proved it on this runner: BlackHole 2ch as the default output and
      # input, the permissions of audio capture and microphone written in both TCC databases for the bundle before the app
      # opens any device (an undecided one makes coreaudiod wait, for every client, on a prompt nobody answers), then the
      # app's own proof through its real factory (--prove-capture): the sound of the PC with and without the app's own tone,
      # one output, one application and the children it starts, the microphone. Then the same permissions written refused:
      # exact zeros, and the app says so. coreaudiod is restarted between the two, which also frees it after a run that hung.
      - name: Prove the capture with the app
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1
          brew install --cask blackhole-2ch > "$RUNNER_TEMP/brew-blackhole.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/brew-blackhole.log"; exit 1; }
          brew install switchaudio-osx > "$RUNNER_TEMP/brew-switchaudio.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/brew-switchaudio.log"; exit 1; }
          sudo killall coreaudiod
          sleep 5
          SwitchAudioSource -a -f cli
          for type in output input system; do
            SwitchAudioSource -t "$type" -s 'BlackHole 2ch'
          done
          echo "default output: $(SwitchAudioSource -t output -c), input: $(SwitchAudioSource -t input -c)"
          app="$RUNNER_TEMP/app/Hindsound.app"
          program="$app/Contents/MacOS/hindsound"
          folder="$RUNNER_TEMP/mac-capture"
          mkdir -p "$folder"
          python3 - "$folder" <<'EOF'
          import array, math, sys, wave
          folder, rate, seconds = sys.argv[1], 48000, 90
          tone = array.array('h')
          for i in range(rate * seconds):
              value = int(0.5 * 32767 * math.sin(2 * math.pi * 1000 * i / rate))
              tone.extend((value, value))
          for name, data in (('tone.wav', tone.tobytes()), ('silence.wav', bytes(rate * seconds * 4))):
              with wave.open(f'{folder}/{name}', 'wb') as f:
                  f.setnchannels(2)
                  f.setsampwidth(2)
                  f.setframerate(rate)
                  f.writeframes(data)
          EOF
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^#* *designated => //p' | head -n 1)
          echo "designated requirement: $requirement"
          csreq -r "=$requirement" -b "$folder/csreq.bin"
          hex=$(xxd -p "$folder/csreq.bin" | tr -d '\n')
          grant() {
            for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
              for service in kTCCServiceAudioCapture kTCCServiceMicrophone; do
                sudo sqlite3 "$db" "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, flags, last_modified) values ('$service', 'io.github.quelquun667.hindsound', 0, $1, 3, 1, X'$hex', 0, CAST(strftime('%s','now') AS INTEGER));" \
                  && echo "tcc: $service auth_value=$1 written in $db" || echo "tcc: $service not written in $db"
              done
            done
            sudo killall tccd || true
            killall tccd 2> /dev/null || true
            sleep 2
          }
          # Through Launch Services, as the probe did: launched from this shell, the runner would be the process TCC asks
          # about (run 44940346633: the microphone granted to it, the audio capture undecided, each tap stuck 60 s).
          prove() {
            rm -f "$folder/$1.result"
            perl -e 'alarm shift; exec @ARGV' "$2" open -n -W --stdout "$folder/$1.out" --stderr "$folder/$1.err" "$app" --args "${@:3}"               || { echo "prove-capture $1: open ended by the time limit"; pkill -f 'Hindsound.app/Contents/MacOS/hindsound' || true; }
            cat "$folder/$1.out" "$folder/$1.err" 2> /dev/null || true
            echo "prove-capture $1: $(cat "$folder/$1.result" 2> /dev/null || echo 'no result')"
          }
          grant 2
          prove granted 240 --prove-capture "$folder"
          sudo killall coreaudiod
          sleep 5
          echo "after the restart of coreaudiod: output $(SwitchAudioSource -t output -c), input $(SwitchAudioSource -t input -c)"
          grant 0
          prove denied 150 --prove-capture "$folder" --denied
          grep -qx pass "$folder/granted.result" && grep -qx pass "$folder/denied.result"

      # The listening of a clip: the app plays a 1 kHz tone it encoded in MP3 with its own player (an AudioQueue on the
      # default output) and hears it at the same time on the input of BlackHole 2ch, made the default output and input (a
      # loopback device: its input gives back what its output plays). The microphone right of the bundle is written in both
      # TCC databases before any device opens: the input of BlackHole is opened, and a right not decided leaves coreaudiod
      # stuck for every client. The app says the level, the dominant frequency, the silence after Stop and after the end.
      - name: Play a clip with the app and hear it on BlackHole
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: |
          app="$RUNNER_TEMP/app/Hindsound.app"
          program="$app/Contents/MacOS/hindsound"
          folder="$RUNNER_TEMP/mac-preview"
          mkdir -p "$folder"
          printf '%s\n' '{"audio":{"micDeviceId":"disabled"}}' > "$folder/settings.json"
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^#* *designated => //p' | head -n 1)
          csreq -r "=$requirement" -b "$folder/csreq.bin"
          hex=$(xxd -p "$folder/csreq.bin" | tr -d '\n')
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            sudo sqlite3 "$db" "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, flags, last_modified) values ('kTCCServiceMicrophone', 'io.github.quelquun667.hindsound', 0, 2, 3, 1, X'$hex', 0, CAST(strftime('%s','now') AS INTEGER));"
            echo "tcc: kTCCServiceMicrophone in $db: $(sudo sqlite3 "$db" "select auth_value from access where service = 'kTCCServiceMicrophone' and client = 'io.github.quelquun667.hindsound';")"
          done
          sudo killall tccd || true
          brew install --cask blackhole-2ch > "$folder/brew-blackhole.log" 2>&1 || { tail -n 20 "$folder/brew-blackhole.log"; exit 1; }
          brew install switchaudio-osx > "$folder/brew-switchaudio.log" 2>&1 || { tail -n 20 "$folder/brew-switchaudio.log"; exit 1; }
          sudo killall coreaudiod || true
          for _ in $(seq 1 60); do
            SwitchAudioSource -a -t output 2> /dev/null | grep -q 'BlackHole 2ch' && break
            sleep 0.5
          done
          for type in output input system; do
            SwitchAudioSource -t "$type" -s 'BlackHole 2ch' > /dev/null
            echo "default $type: $(SwitchAudioSource -t "$type" -c)"
          done
          code=0
          perl -e 'alarm shift; exec @ARGV' 120 "$program" --settings "$folder/settings.json" --no-mic --no-clipboard --no-hotkeys \
            --offscreen --prove-preview "$folder/out" || code=$?
          sed 's/^/  log preview: /' "$folder/settings.log" || true
          echo "prove-preview: exit code $code"
          [ "$code" -eq 0 ] && grep -q "preview-proof result pass" "$folder/settings.log"

      # The whole app, launched as a user launches it (open, through Launch Services, so that TCC asks about the bundle and
      # not the runner), with settings of its own: clips of 10 s in a folder of the step, the microphone disabled, the copy to
      # the clipboard on. The rights of audio capture and microphone are written granted before anything opens a device (the
      # step of the capture leaves them refused). Then: the capture starts (its line in the log, with the memory), afplay
      # plays a 1 kHz tone on BlackHole 2ch, "hindsound --save" from a second launch, the clip written in the folder of the
      # settings (size, duration by afinfo, the 1 kHz measured on its decoding by afconvert), the pasteboard holding the URL
      # of the clip, the notification shown, the resident memory of the process, and SIGTERM, which ends the app cleanly:
      # its exit code is in its log, since open does not give it back.
      - name: Run the whole app, save a clip of a 1 kHz tone and quit
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: |
          app="$RUNNER_TEMP/app/Hindsound.app"
          program="$app/Contents/MacOS/hindsound"
          folder="$RUNNER_TEMP/mac-whole"
          clips="$folder/clips"
          log="$folder/settings.log"
          mkdir -p "$folder" "$clips"
          printf '{"clipSeconds":10,"audio":{"micDeviceId":"disabled"},"export":{"outputFolder":"%s","copyToClipboard":true},"general":{"startWithWindows":false}}\n' "$clips" > "$folder/settings.json"
          cat "$folder/settings.json"
          brew install --cask blackhole-2ch > "$folder/brew-blackhole.log" 2>&1 || { tail -n 20 "$folder/brew-blackhole.log"; exit 1; }
          brew install switchaudio-osx > "$folder/brew-switchaudio.log" 2>&1 || { tail -n 20 "$folder/brew-switchaudio.log"; exit 1; }
          for _ in $(seq 1 60); do
            SwitchAudioSource -a -t output 2> /dev/null | grep -q 'BlackHole 2ch' && break
            sleep 0.5
          done
          for type in output input system; do
            SwitchAudioSource -t "$type" -s 'BlackHole 2ch' > /dev/null
            echo "default $type: $(SwitchAudioSource -t "$type" -c)"
          done
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^#* *designated => //p' | head -n 1)
          csreq -r "=$requirement" -b "$folder/csreq.bin"
          hex=$(xxd -p "$folder/csreq.bin" | tr -d '\n')
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            for service in kTCCServiceAudioCapture kTCCServiceMicrophone; do
              sudo sqlite3 "$db" "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, flags, last_modified) values ('$service', 'io.github.quelquun667.hindsound', 0, 2, 3, 1, X'$hex', 0, CAST(strftime('%s','now') AS INTEGER));"
              echo "tcc: $service in $db: $(sudo sqlite3 "$db" "select auth_value from access where service = '$service' and client = 'io.github.quelquun667.hindsound';")"
            done
          done
          sudo killall tccd || true
          killall tccd 2> /dev/null || true
          sleep 2
          python3 - "$folder/tone.wav" <<'PY'
          import array, math, sys, wave
          rate, seconds = 48000, 12
          tone = array.array('h')
          for i in range(rate * seconds):
              value = int(0.5 * 32767 * math.sin(2 * math.pi * 1000 * i / rate))
              tone.extend((value, value))
          with wave.open(sys.argv[1], 'wb') as f:
              f.setnchannels(2)
              f.setsampwidth(2)
              f.setframerate(rate)
              f.writeframes(tone.tobytes())
          PY
          # Each check says its result and the step goes on to the next: the log then has every number.
          set +e
          failed=0
          check() { if [ "$2" -eq 0 ]; then echo "whole app: $1 pass"; else echo "whole app: $1 FAIL"; failed=1; fi; }
          wait_for() {
            for _ in $(seq 1 "$2"); do
              grep -qE "$1" "$log" 2> /dev/null && return 0
              sleep 0.5
            done
            return 1
          }
          perl -e 'alarm shift; exec @ARGV' 240 open -n -W --stdout "$folder/app.out" --stderr "$folder/app.err" "$app" --args --settings "$folder/settings.json" &
          opener=$!
          wait_for 'capture started:' 120; check "capture started" $?
          pid=$(pgrep -f 'Hindsound.app/Contents/MacOS/hindsound --settings' | head -n 1)
          echo "whole app: pid ${pid:-none}"
          perl -e 'alarm shift; exec @ARGV' 30 afplay "$folder/tone.wav" &
          player=$!
          sleep 11
          [ -n "$pid" ] && echo "whole app: resident memory while capturing $(ps -o rss= -p "$pid" | tr -d ' ') KB (ps)"
          code=0
          perl -e 'alarm shift; exec @ARGV' 30 "$program" --settings "$folder/settings.json" --save || code=$?
          echo "--save from a second launch: exit code $code (2: handed to the running instance)"
          [ "$code" -eq 2 ]; check "--save handed over" $?
          wait_for 'clip saved:|clip not saved:' 60; check "clip saved line" $?
          wait_for 'notification (Saved|Partial|WavFallback):' 20; check "notification shown" $?
          clip=$(find "$clips" -maxdepth 1 -name '*.mp3' | head -n 1)
          echo "whole app: clip '${clip:-none}', $(stat -f %z "$clip" 2> /dev/null || echo 0) bytes"
          [ -n "$clip" ] && [ -s "$clip" ]; check "clip written in the folder of the settings" $?
          if [ -n "$clip" ]; then
            afinfo "$clip" | sed 's/^/  afinfo: /'
            afconvert -f WAVE -d LEI16 "$clip" "$folder/clip.wav"; check "clip decoded" $?
            python3 - "$folder/clip.wav" <<'PY'; check "1 kHz in the clip" $?
          import array, math, sys, wave
          with wave.open(sys.argv[1], 'rb') as f:
              rate, channels = f.getframerate(), f.getnchannels()
              data = array.array('h', f.readframes(f.getnframes()))
          left = [data[i] / 32768.0 for i in range(0, len(data), channels)]
          print(f"clip: {len(left) / rate:.2f} s at {rate} Hz, {channels} channels")
          def level(samples, hz):
              w = 2 * math.pi * hz / rate
              k = 2 * math.cos(w)
              s1 = s2 = 0.0
              for x in samples:
                  s1, s2 = x + k * s1 - s2, s1
              power = s1 * s1 + s2 * s2 - k * s1 * s2
              return 20 * math.log10(max(1e-12, 2 * math.sqrt(max(0.0, power)) / len(samples)))
          # The loudest second: the tone plays in the last part of the clip, after the silence before afplay.
          seconds = [left[i:i + rate] for i in range(0, len(left) - rate + 1, rate)]
          best = max(seconds, key=lambda s: sum(x * x for x in s))
          rms = 20 * math.log10(max(1e-12, math.sqrt(sum(x * x for x in best) / len(best))))
          peak = 20 * math.log10(max(1e-12, max(abs(x) for x in best)))
          a1000, a440, a2000 = level(best, 1000), level(best, 440), level(best, 2000)
          # A pure sine of amplitude A has a RMS of A/sqrt(2): its Goertzel amplitude in dBFS is the RMS plus 3 dB.
          print(f"clip: loudest second rms={rms:.1f}dBFS peak={peak:.1f}dBFS a1000={a1000:.1f}dBFS a440={a440:.1f}dBFS a2000={a2000:.1f}dBFS")
          sys.exit(0 if rms > -40 and a1000 > rms and a1000 - a440 > 30 and a1000 - a2000 > 30 else 1)
          PY
            pasted=$(osascript -l JavaScript -e 'ObjC.import("AppKit"); ObjC.unwrap($.NSPasteboard.generalPasteboard.stringForType("public.file-url"))' 2>&1)
            echo "whole app: pasteboard file URL '$pasted'"
            python3 - "$pasted" "$clip" <<'PY'; check "pasteboard holds the URL of the clip" $?
          import os, sys, urllib.parse
          url = urllib.parse.urlparse(sys.argv[1])
          sys.exit(0 if url.scheme == 'file' and os.path.realpath(urllib.parse.unquote(url.path)) == os.path.realpath(sys.argv[2]) else 1)
          PY
          fi
          [ -n "$pid" ] && echo "whole app: resident memory after the clip $(ps -o rss= -p "$pid" | tr -d ' ') KB (ps)"
          wait "$player" || true
          if [ -n "$pid" ]; then
            kill -TERM "$pid"; check "SIGTERM sent" $?
          fi
          opener_code=0
          wait "$opener" || opener_code=$?
          echo "whole app: open ended with code $opener_code"
          pgrep -f 'Hindsound.app/Contents/MacOS/hindsound --settings' > /dev/null && { echo "whole app: still running"; pkill -KILL -f 'Hindsound.app/Contents/MacOS/hindsound --settings'; failed=1; }
          cat "$folder/app.out" "$folder/app.err" 2> /dev/null | sed 's/^/  console: /' || true
          sed 's/^/  log whole: /' "$log" || true
          grep -q 'leaving with exit code 0' "$log"; check "the app left with exit code 0" $?
          exit $failed

      # "hindsound --save" with no Hindsound running, from the shell as Terminal or the Shortcuts app would run it: the
      # program must start its bundle through open (Launch Services) and leave, so that the app is not a child of the shell
      # (macOS would ask the shell for the permissions, and the app would end with it). The app that starts is a child of
      # launchd, its parent pid 1; SIGTERM ends it, and its log gives its exit code.
      - name: Start the app from --save when none is running
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          app="$RUNNER_TEMP/app/Hindsound.app"
          program="$app/Contents/MacOS/hindsound"
          folder="$RUNNER_TEMP/mac-save-start"
          log="$folder/settings.log"
          mkdir -p "$folder/clips"
          printf '{"audio":{"micDeviceId":"disabled"},"export":{"outputFolder":"%s","copyToClipboard":false},"general":{"startWithWindows":false}}\n' "$folder/clips" > "$folder/settings.json"
          set +e
          failed=0
          check() { if [ "$2" -eq 0 ]; then echo "save start: $1 pass"; else echo "save start: $1 FAIL"; failed=1; fi; }
          running() { pgrep -f 'Hindsound.app/Contents/MacOS/hindsound --settings' | head -n 1; }
          [ -z "$(running)" ]; check "no Hindsound running before" $?
          code=0
          perl -e 'alarm shift; exec @ARGV' 30 "$program" --settings "$folder/settings.json" --save || code=$?
          echo "save start: --save with no running instance ended with code $code"
          [ "$code" -eq 0 ]; check "--save left with code 0" $?
          pid=""
          for _ in $(seq 1 60); do
            pid=$(running)
            [ -n "$pid" ] && break
            sleep 0.5
          done
          parent=$([ -n "$pid" ] && ps -o ppid= -p "$pid" | tr -d ' ')
          echo "save start: pid ${pid:-none}, parent pid ${parent:-none}, command $([ -n "$pid" ] && ps -o command= -p "$pid")"
          [ -n "$pid" ]; check "the app runs after --save" $?
          [ "$parent" = 1 ]; check "the app is a child of launchd, not of the shell" $?
          grep -q 'through Launch Services (open)' "$log"; check "the log says --save went through open" $?
          sleep 5
          [ -n "$pid" ] && kill -TERM "$pid"
          for _ in $(seq 1 40); do
            [ -z "$(running)" ] && break
            sleep 0.5
          done
          [ -n "$(running)" ] && { echo "save start: still running"; pkill -KILL -f 'Hindsound.app/Contents/MacOS/hindsound --settings'; failed=1; }
          sed 's/^/  log save start: /' "$log" || true
          grep -q 'leaving with exit code 0' "$log"; check "the app left with exit code 0" $?
          exit $failed

      - name: Keep the pages of the window
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-dump
          path: ${{ runner.temp }}/mac-dump/
          if-no-files-found: warn

      # What the job mac-older needs from this one: the bundle as the steps above proved it (zipped as the release zips it,
      # so that its signature and its execute bits come through the artifact), and the dylibs and the fonts the tests load.
      - name: Pack the app for the older systems
        id: handoff
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/handoff"
          ditto -c -k --norsrc --noextattr --noqtn --keepParent "$RUNNER_TEMP/app/Hindsound.app" "$RUNNER_TEMP/handoff/Hindsound.app.zip"
          cp -R "$RUNNER_TEMP/natives" "$RUNNER_TEMP/handoff/natives"
          cp -R "$RUNNER_TEMP/fonts" "$RUNNER_TEMP/handoff/fonts"
          du -sh "$RUNNER_TEMP/handoff"/*

      - name: Keep the app for the older systems
        if: ${{ !cancelled() && steps.handoff.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app
          path: ${{ runner.temp }}/handoff/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # The app of the job mac, on a system under it that the minimum of the Info.plist (macOS 14.4) covers: macOS 15 on Apple
  # silicon. macOS 14 is not here: GitHub retired its runner image on 2 November 2026 (the label macos-14 gets "The
  # configuration 'macos-14-arm64-us-default' is not supported", run 45070396216), so nothing hosted can run the app on
  # 14.4 to 14.7. The bundle, the dylibs and the fonts are the ones the job mac built and proved (its artifact mac-app);
  # nothing is built again but the tests, which run here on the system itself. Each runner says its own version first: an
  # image under 14.4 would not be allowed to capture a process (the Core Audio taps begin at 14.2, the app asks for 14.4),
  # and the job then fails on that line, not on something it cannot prove. The steps of the proofs are those of the job
  # mac, word for word (the test CiWorkflowTests keeps them so), with the same preparation: BlackHole 2ch as the virtual
  # device, the rights of TCC written for the bundle.
  mac-older:
    needs: mac
    if: ${{ !cancelled() }}
    name: mac-older (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Say which macOS this is
        id: system
        env:
          IMAGE: ${{ matrix.os }}
        run: |
          sw_vers
          uname -m
          version=$(sw_vers -productVersion)
          IFS=. read -r major minor _ <<< "$version"
          if [ "$(uname -m)" != arm64 ]; then
            echo "::error::$IMAGE is not an Apple silicon runner (uname -m gives $(uname -m)): nothing of the app is proven here."
            exit 1
          fi
          if [ "$major" -lt 14 ] || { [ "$major" -eq 14 ] && [ "${minor:-0}" -lt 4 ]; }; then
            echo "::error::$IMAGE is macOS $version, under the 14.4 of the Info.plist: the capture of the app is NOT proven on this runner."
            echo "macOS $version on $IMAGE: under 14.4, the app is not proven here." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "$IMAGE: macOS $version ($(sw_vers -buildVersion)), $(uname -m)" >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch the app of the job mac
        if: ${{ steps.system.outcome == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app
          path: ${{ runner.temp }}/handoff

      # The dylibs and the fonts are checked as the job mac checks them (their SHA-256 written when they were built, then
      # what each one links, with the sha256sum shim of the font script), the bundle is unzipped where the steps below look
      # for it, and its signature must still hold after the zip and the artifact: the TCC rights name its requirement.
      - name: Unpack the app and check what came through
        id: unpack
        if: ${{ steps.system.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/app"
          printf '#!/bin/sh\nexec shasum -a 256 "$@"\n' > "$RUNNER_TEMP/bin/sha256sum"
          chmod +x "$RUNNER_TEMP/bin/sha256sum"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cp -R "$RUNNER_TEMP/handoff/natives" "$RUNNER_TEMP/natives"
          cp -R "$RUNNER_TEMP/handoff/fonts" "$RUNNER_TEMP/fonts"
          (cd "$RUNNER_TEMP/natives" && shasum -a 256 -c SHA256SUMS)
          bash tools/mac/build-natives.sh --check "$RUNNER_TEMP/natives"
          bash tools/linux/fetch-fonts.sh --check "$RUNNER_TEMP/fonts"
          ditto -x -k "$RUNNER_TEMP/handoff/Hindsound.app.zip" "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/Hindsound.app"
          codesign --verify --deep --strict "$app"
          echo "minimum system of the bundle: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          ls -l "$app/Contents/MacOS/hindsound"

      - name: Build
        id: build
        if: ${{ steps.system.outcome == 'success' }}
        run: |
          dotnet build tests/Hindsound.Mac.Tests/Hindsound.Mac.Tests.csproj -c Release

      # The tests of the Mac on this system, the category Mac among them (only the tests that need a device are left out, as
      # in the job mac). The dylibs next to them and the fonts from HINDSOUND_FONT_DIR, as there.
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          HINDSOUND_FONT_DIR: ${{ runner.temp }}/fonts
        run: |
          cp "$RUNNER_TEMP"/natives/*.dylib tests/Hindsound.Mac.Tests/bin/Release/net10.0/
          dotnet test tests/Hindsound.Mac.Tests/Hindsound.Mac.Tests.csproj -c Release --no-build --filter "Category!=Device" --logger "console;verbosity=normal"

      - name: Prove the desktop parts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          dotnet test tests/Hindsound.Mac.Tests/Hindsound.Mac.Tests.csproj -c Release --no-build             --filter "FullyQualifiedName~Hindsound.Mac.Tests.Desktop.MacDesktopProofs" --logger "console;verbosity=detailed"

      # The app of the bundle, with its own dylibs and fonts (no HINDSOUND_FONT_DIR), settings of its own in which the
      # microphone is disabled, and every option that keeps it from touching the runner's session.
      - name: Draw the pages and prove the MP3 with the app
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        env:
          OUT: ${{ runner.temp }}/mac-dump
        run: |
          program="$RUNNER_TEMP/app/Hindsound.app/Contents/MacOS/hindsound"
          failed=0
          for scale in 1 1.5; do
            folder="$RUNNER_TEMP/mac-run-$scale"
            mkdir -p "$folder" "$OUT/$scale"
            printf '%s\n' '{"audio":{"micDeviceId":"disabled"}}' > "$folder/settings.json"
            code=0
            SDL_VIDEO_DRIVER=offscreen perl -e 'alarm shift; exec @ARGV' 300 "$program" --settings "$folder/settings.json" --no-mic --no-clipboard \
              --no-hotkeys --offscreen --dump-settings "$OUT/$scale" --scale "$scale" || code=$?
            sed "s/^/  log $scale: /" "$folder/settings.log" || true
            count=$(find "$OUT/$scale" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')
            echo "scale $scale: exit code $code, $count PNG files"
            [ "$code" -eq 0 ] && [ "$count" -gt 0 ] || failed=1
            (cd "$OUT/$scale" && shasum -a 256 *.png | sed "s/^/page $scale /")
          done
          mkdir -p "$RUNNER_TEMP/mac-mp3"
          printf '%s\n' '{"audio":{"micDeviceId":"disabled"}}' > "$RUNNER_TEMP/mac-mp3/settings.json"
          code=0
          perl -e 'alarm shift; exec @ARGV' 120 "$program" --settings "$RUNNER_TEMP/mac-mp3/settings.json" --no-mic --no-clipboard --no-hotkeys \
            --offscreen --prove-mp3 "$RUNNER_TEMP/mac-mp3/out" || code=$?
          sed 's/^/  log mp3: /' "$RUNNER_TEMP/mac-mp3/settings.log" || true
          echo "prove-mp3: exit code $code"
          [ "$code" -eq 0 ] || failed=1
          exit $failed

      # The loop of the app on the main thread, with the session of the runner: the icon of the menu bar and its menu read
      # back from AppKit, a Carbon shortcut registered and its press sent, then a real press posted as a keyboard would (with
      # the PostEvent and Accessibility rights written in TCC for the bundle, as the probe wrote its rights; reported apart),
      # and "hindsound --save" from a second launch received by the running one.
      - name: Prove the loop, the icon, the shortcut and --save with the app
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: |
          app="$RUNNER_TEMP/app/Hindsound.app"
          program="$app/Contents/MacOS/hindsound"
          folder="$RUNNER_TEMP/mac-loop"
          mkdir -p "$folder"
          printf '%s\n' '{"audio":{"micDeviceId":"disabled"}}' > "$folder/settings.json"
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^#* *designated => //p' | head -n 1)
          echo "designated requirement: $requirement"
          if csreq -r "=$requirement" -b "$folder/csreq.bin"; then
            hex=$(xxd -p "$folder/csreq.bin" | tr -d '\n')
            for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
              for service in kTCCServicePostEvent kTCCServiceAccessibility; do
                sudo sqlite3 "$db" "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, flags, last_modified) values ('$service', 'io.github.quelquun667.hindsound', 0, 2, 3, 1, X'$hex', 0, CAST(strftime('%s','now') AS INTEGER));"                   && echo "tcc: $service written in $db" || echo "tcc: $service not written in $db"
              done
            done
            sudo killall tccd || true
          fi
          perl -e 'alarm shift; exec @ARGV' 150 "$program" --settings "$folder/settings.json" --no-mic --no-clipboard --prove-loop > "$folder/proof.out" 2>&1 &
          proof=$!
          for attempt in $(seq 1 120); do
            grep -q "loop proof: ready, waiting for --save" "$folder/settings.log" 2> /dev/null && break
            sleep 0.5
          done
          code=0
          perl -e 'alarm shift; exec @ARGV' 30 "$program" --settings "$folder/settings.json" --save || code=$?
          echo "--save from a second launch: exit code $code (2: handed to the running instance)"
          proof_code=0
          wait "$proof" || proof_code=$?
          echo "--prove-loop: exit code $proof_code"
          cat "$folder/proof.out" || true
          sed 's/^/  log loop: /' "$folder/settings.log" || true
          [ "$code" -eq 2 ] && [ "$proof_code" -eq 0 ] && grep -q "loop proof: result pass" "$folder/settings.log"

      # A real notification through SDL's Cocoa window, not the offscreen driver. The app says when it is up and where, and
      # holds it; screencapture takes the main screen, and the pixels of the accent (its bars) are counted where it is. The
      # app itself checks that the app in front stayed in front and that its window never had the focus, then clicks it with
      # a mouse event of the system (reported, the runner may drop it) and lets it go.
      - name: Show a notification with the app
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: |
          program="$RUNNER_TEMP/app/Hindsound.app/Contents/MacOS/hindsound"
          proof="$RUNNER_TEMP/mac-notification"
          mkdir -p "$proof"
          perl -e 'alarm shift; exec @ARGV' 200 "$program" --prove-notification "$proof/out" > "$proof/console.txt" 2>&1 &
          app=$!
          for _ in $(seq 1 120); do
            [ -f "$proof/out/ready" ] && break
            kill -0 "$app" 2> /dev/null || break
            sleep 0.5
          done
          failed=0
          if [ -f "$proof/out/ready" ]; then
            echo "front app seen from bash: $(lsappinfo info -only name "$(lsappinfo front)" 2>&1 | tr '\n' ' ')"
            screencapture -x -m "$proof/screen.png" || failed=1
            sips -s format bmp "$proof/screen.png" --out "$proof/screen.bmp" > /dev/null || failed=1
            python3 - "$proof/out/ready" "$proof/screen.bmp" <<'EOF' || failed=1
          import struct, sys
          ready = dict(line.strip().split('=', 1) for line in open(sys.argv[1]) if '=' in line)
          data = open(sys.argv[2], 'rb').read()
          offset = struct.unpack_from('<I', data, 10)[0]
          width, height = struct.unpack_from('<ii', data, 18)
          bpp, compression = struct.unpack_from('<HI', data, 28)
          top_down, height, step = height < 0, abs(height), bpp // 8
          stride = (width * step + 3) & ~3
          if compression in (3, 6):
              masks = struct.unpack_from('<III', data, 54)
          else:
              masks = (0xFF0000, 0x00FF00, 0x0000FF)
          shifts = [(m & -m).bit_length() - 1 for m in masks]
          def pixel(x, y):
              i = offset + (y if top_down else height - 1 - y) * stride + x * step
              value = int.from_bytes(data[i:i + step], 'little')
              return tuple((value & m) >> s for m, s in zip(masks, shifts))
          accent = int(ready['accent'], 16)
          target = ((accent >> 16) & 255, (accent >> 8) & 255, accent & 255)
          near = lambda p: all(abs(p[c] - target[c]) <= 24 for c in range(3))
          factor = width / int(ready['screen_w'])
          x, y, w, h = (int(ready[k]) for k in ('x', 'y', 'w', 'h'))
          x0, y0, x1, y1 = int(x * factor), int(y * factor), int((x + w) * factor), int((y + h) * factor)
          inside = sum(1 for py in range(max(0, y0), min(height, y1)) for px in range(max(0, x0), min(width, x1)) if near(pixel(px, py)))
          everywhere = sum(1 for py in range(height) for px in range(width) if near(pixel(px, py)))
          expected = int(ready['expected']) * (factor / float(ready['scale'])) ** 2
          print(f"notification pixels: screen {width}x{height} bpp={bpp} factor={factor} rect=({x0},{y0})-({x1},{y1}) "
                f"accent_inside={inside} accent_elsewhere={everywhere - inside} expected={expected:.0f}")
          print(f"notification pixels: stripe {pixel(min(width - 1, x1 - 1), (y0 + y1) // 2)} fill {pixel((x0 + x1) // 2, y0 + int(4 * factor))}")
          sys.exit(0 if inside >= 0.8 * expected and inside > 100 else 1)
          EOF
          else
            echo "the notification never said it was up"
            failed=1
          fi
          touch "$proof/out/captured"
          code=0
          wait "$app" || code=$?
          sed 's/^/  /' "$proof/console.txt"
          echo "prove-notification: exit code $code"
          [ "$code" -eq 0 ] || failed=1
          exit $failed

      # The lists of the settings and the watch of the devices, on the HAL of the runner with BlackHole 2ch installed (the
      # probe's way: brew, then coreaudiod started again so it loads the driver). The app reads the process list (itself,
      # named after its bundle, and its parent) and the devices, then waits for the watch to see the default output that
      # SwitchAudioSource changes, then for afplay (a tone of 1 kHz for 3 s) to be in the list of the applications that play
      # and to leave it when it ends. The app opens no device: no right of TCC is asked, so none is written.
      - name: Prove the devices and the applications that play with the app
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          sleep 3
          echo "outputs: $(SwitchAudioSource -a -t output | tr '\n' '|')"
          echo "inputs: $(SwitchAudioSource -a -t input | tr '\n' '|')"
          program="$RUNNER_TEMP/app/Hindsound.app/Contents/MacOS/hindsound"
          proof="$RUNNER_TEMP/mac-devices"
          mkdir -p "$proof"
          python3 - "$proof/tone.wav" <<'EOF'
          import math, struct, sys, wave
          with wave.open(sys.argv[1], 'wb') as out:
              out.setnchannels(2)
              out.setsampwidth(2)
              out.setframerate(48000)
              frames = (int(16384 * math.sin(2 * math.pi * 1000 * i / 48000)) for i in range(3 * 48000))
              out.writeframes(b''.join(struct.pack('<hh', v, v) for v in frames))
          EOF
          perl -e 'alarm shift; exec @ARGV' 150 "$program" --prove-devices "$proof/out" > "$proof/console.txt" 2>&1 &
          app=$!
          failed=0
          for _ in $(seq 1 120); do
            [ -f "$proof/out/ready-switch" ] && break
            kill -0 "$app" 2> /dev/null || break
            sleep 0.5
          done
          if [ -f "$proof/out/ready-switch" ]; then
            current=$(SwitchAudioSource -c -t output)
            other=$(SwitchAudioSource -a -t output | grep -vxF "$current" | head -n 1)
            echo "switch: default output '$current' -> '$other'"
            SwitchAudioSource -t output -s "$other" || failed=1
          else
            echo "the app never said it was ready for the switch"
            failed=1
          fi
          for _ in $(seq 1 120); do
            [ -f "$proof/out/ready-play" ] && break
            kill -0 "$app" 2> /dev/null || break
            sleep 0.5
          done
          if [ -f "$proof/out/ready-play" ]; then
            echo "afplay: started by the shell $$"
            perl -e 'alarm shift; exec @ARGV' 30 afplay "$proof/tone.wav" || failed=1
            echo "afplay: ended"
          else
            echo "the app never said it was ready for afplay"
            failed=1
          fi
          code=0
          wait "$app" || code=$?
          sed 's/^/  /' "$proof/console.txt"
          echo "prove-devices: exit code $code"
          [ "$code" -eq 0 ] || failed=1
          if [ "$failed" -ne 0 ]; then
            sudo killall coreaudiod || true
          fi
          exit $failed
      # The capture with real sound, as the probe of M0 proved it on this runner: BlackHole 2ch as the default output and
      # input, the permissions of audio capture and microphone written in both TCC databases for the bundle before the app
      # opens any device (an undecided one makes coreaudiod wait, for every client, on a prompt nobody answers), then the
      # app's own proof through its real factory (--prove-capture): the sound of the PC with and without the app's own tone,
      # one output, one application and the children it starts, the microphone. Then the same permissions written refused:
      # exact zeros, and the app says so. coreaudiod is restarted between the two, which also frees it after a run that hung.
      - name: Prove the capture with the app
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1
          brew install --cask blackhole-2ch > "$RUNNER_TEMP/brew-blackhole.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/brew-blackhole.log"; exit 1; }
          brew install switchaudio-osx > "$RUNNER_TEMP/brew-switchaudio.log" 2>&1 || { tail -n 30 "$RUNNER_TEMP/brew-switchaudio.log"; exit 1; }
          sudo killall coreaudiod
          sleep 5
          SwitchAudioSource -a -f cli
          for type in output input system; do
            SwitchAudioSource -t "$type" -s 'BlackHole 2ch'
          done
          echo "default output: $(SwitchAudioSource -t output -c), input: $(SwitchAudioSource -t input -c)"
          app="$RUNNER_TEMP/app/Hindsound.app"
          program="$app/Contents/MacOS/hindsound"
          folder="$RUNNER_TEMP/mac-capture"
          mkdir -p "$folder"
          python3 - "$folder" <<'EOF'
          import array, math, sys, wave
          folder, rate, seconds = sys.argv[1], 48000, 90
          tone = array.array('h')
          for i in range(rate * seconds):
              value = int(0.5 * 32767 * math.sin(2 * math.pi * 1000 * i / rate))
              tone.extend((value, value))
          for name, data in (('tone.wav', tone.tobytes()), ('silence.wav', bytes(rate * seconds * 4))):
              with wave.open(f'{folder}/{name}', 'wb') as f:
                  f.setnchannels(2)
                  f.setsampwidth(2)
                  f.setframerate(rate)
                  f.writeframes(data)
          EOF
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^#* *designated => //p' | head -n 1)
          echo "designated requirement: $requirement"
          csreq -r "=$requirement" -b "$folder/csreq.bin"
          hex=$(xxd -p "$folder/csreq.bin" | tr -d '\n')
          grant() {
            for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
              for service in kTCCServiceAudioCapture kTCCServiceMicrophone; do
                sudo sqlite3 "$db" "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, flags, last_modified) values ('$service', 'io.github.quelquun667.hindsound', 0, $1, 3, 1, X'$hex', 0, CAST(strftime('%s','now') AS INTEGER));" \
                  && echo "tcc: $service auth_value=$1 written in $db" || echo "tcc: $service not written in $db"
              done
            done
            sudo killall tccd || true
            killall tccd 2> /dev/null || true
            sleep 2
          }
          # Through Launch Services, as the probe did: launched from this shell, the runner would be the process TCC asks
          # about (run 44940346633: the microphone granted to it, the audio capture undecided, each tap stuck 60 s).
          prove() {
            rm -f "$folder/$1.result"
            perl -e 'alarm shift; exec @ARGV' "$2" open -n -W --stdout "$folder/$1.out" --stderr "$folder/$1.err" "$app" --args "${@:3}"               || { echo "prove-capture $1: open ended by the time limit"; pkill -f 'Hindsound.app/Contents/MacOS/hindsound' || true; }
            cat "$folder/$1.out" "$folder/$1.err" 2> /dev/null || true
            echo "prove-capture $1: $(cat "$folder/$1.result" 2> /dev/null || echo 'no result')"
          }
          grant 2
          prove granted 240 --prove-capture "$folder"
          sudo killall coreaudiod
          sleep 5
          echo "after the restart of coreaudiod: output $(SwitchAudioSource -t output -c), input $(SwitchAudioSource -t input -c)"
          grant 0
          prove denied 150 --prove-capture "$folder" --denied
          grep -qx pass "$folder/granted.result" && grep -qx pass "$folder/denied.result"

      # The listening of a clip: the app plays a 1 kHz tone it encoded in MP3 with its own player (an AudioQueue on the
      # default output) and hears it at the same time on the input of BlackHole 2ch, made the default output and input (a
      # loopback device: its input gives back what its output plays). The microphone right of the bundle is written in both
      # TCC databases before any device opens: the input of BlackHole is opened, and a right not decided leaves coreaudiod
      # stuck for every client. The app says the level, the dominant frequency, the silence after Stop and after the end.
      - name: Play a clip with the app and hear it on BlackHole
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: |
          app="$RUNNER_TEMP/app/Hindsound.app"
          program="$app/Contents/MacOS/hindsound"
          folder="$RUNNER_TEMP/mac-preview"
          mkdir -p "$folder"
          printf '%s\n' '{"audio":{"micDeviceId":"disabled"}}' > "$folder/settings.json"
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^#* *designated => //p' | head -n 1)
          csreq -r "=$requirement" -b "$folder/csreq.bin"
          hex=$(xxd -p "$folder/csreq.bin" | tr -d '\n')
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            sudo sqlite3 "$db" "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, flags, last_modified) values ('kTCCServiceMicrophone', 'io.github.quelquun667.hindsound', 0, 2, 3, 1, X'$hex', 0, CAST(strftime('%s','now') AS INTEGER));"
            echo "tcc: kTCCServiceMicrophone in $db: $(sudo sqlite3 "$db" "select auth_value from access where service = 'kTCCServiceMicrophone' and client = 'io.github.quelquun667.hindsound';")"
          done
          sudo killall tccd || true
          brew install --cask blackhole-2ch > "$folder/brew-blackhole.log" 2>&1 || { tail -n 20 "$folder/brew-blackhole.log"; exit 1; }
          brew install switchaudio-osx > "$folder/brew-switchaudio.log" 2>&1 || { tail -n 20 "$folder/brew-switchaudio.log"; exit 1; }
          sudo killall coreaudiod || true
          for _ in $(seq 1 60); do
            SwitchAudioSource -a -t output 2> /dev/null | grep -q 'BlackHole 2ch' && break
            sleep 0.5
          done
          for type in output input system; do
            SwitchAudioSource -t "$type" -s 'BlackHole 2ch' > /dev/null
            echo "default $type: $(SwitchAudioSource -t "$type" -c)"
          done
          code=0
          perl -e 'alarm shift; exec @ARGV' 120 "$program" --settings "$folder/settings.json" --no-mic --no-clipboard --no-hotkeys \
            --offscreen --prove-preview "$folder/out" || code=$?
          sed 's/^/  log preview: /' "$folder/settings.log" || true
          echo "prove-preview: exit code $code"
          [ "$code" -eq 0 ] && grep -q "preview-proof result pass" "$folder/settings.log"

      # The whole app, launched as a user launches it (open, through Launch Services, so that TCC asks about the bundle and
      # not the runner), with settings of its own: clips of 10 s in a folder of the step, the microphone disabled, the copy to
      # the clipboard on. The rights of audio capture and microphone are written granted before anything opens a device (the
      # step of the capture leaves them refused). Then: the capture starts (its line in the log, with the memory), afplay
      # plays a 1 kHz tone on BlackHole 2ch, "hindsound --save" from a second launch, the clip written in the folder of the
      # settings (size, duration by afinfo, the 1 kHz measured on its decoding by afconvert), the pasteboard holding the URL
      # of the clip, the notification shown, the resident memory of the process, and SIGTERM, which ends the app cleanly:
      # its exit code is in its log, since open does not give it back.
      - name: Run the whole app, save a clip of a 1 kHz tone and quit
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: |
          app="$RUNNER_TEMP/app/Hindsound.app"
          program="$app/Contents/MacOS/hindsound"
          folder="$RUNNER_TEMP/mac-whole"
          clips="$folder/clips"
          log="$folder/settings.log"
          mkdir -p "$folder" "$clips"
          printf '{"clipSeconds":10,"audio":{"micDeviceId":"disabled"},"export":{"outputFolder":"%s","copyToClipboard":true},"general":{"startWithWindows":false}}\n' "$clips" > "$folder/settings.json"
          cat "$folder/settings.json"
          brew install --cask blackhole-2ch > "$folder/brew-blackhole.log" 2>&1 || { tail -n 20 "$folder/brew-blackhole.log"; exit 1; }
          brew install switchaudio-osx > "$folder/brew-switchaudio.log" 2>&1 || { tail -n 20 "$folder/brew-switchaudio.log"; exit 1; }
          for _ in $(seq 1 60); do
            SwitchAudioSource -a -t output 2> /dev/null | grep -q 'BlackHole 2ch' && break
            sleep 0.5
          done
          for type in output input system; do
            SwitchAudioSource -t "$type" -s 'BlackHole 2ch' > /dev/null
            echo "default $type: $(SwitchAudioSource -t "$type" -c)"
          done
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^#* *designated => //p' | head -n 1)
          csreq -r "=$requirement" -b "$folder/csreq.bin"
          hex=$(xxd -p "$folder/csreq.bin" | tr -d '\n')
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            for service in kTCCServiceAudioCapture kTCCServiceMicrophone; do
              sudo sqlite3 "$db" "insert or replace into access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, flags, last_modified) values ('$service', 'io.github.quelquun667.hindsound', 0, 2, 3, 1, X'$hex', 0, CAST(strftime('%s','now') AS INTEGER));"
              echo "tcc: $service in $db: $(sudo sqlite3 "$db" "select auth_value from access where service = '$service' and client = 'io.github.quelquun667.hindsound';")"
            done
          done
          sudo killall tccd || true
          killall tccd 2> /dev/null || true
          sleep 2
          python3 - "$folder/tone.wav" <<'PY'
          import array, math, sys, wave
          rate, seconds = 48000, 12
          tone = array.array('h')
          for i in range(rate * seconds):
              value = int(0.5 * 32767 * math.sin(2 * math.pi * 1000 * i / rate))
              tone.extend((value, value))
          with wave.open(sys.argv[1], 'wb') as f:
              f.setnchannels(2)
              f.setsampwidth(2)
              f.setframerate(rate)
              f.writeframes(tone.tobytes())
          PY
          # Each check says its result and the step goes on to the next: the log then has every number.
          set +e
          failed=0
          check() { if [ "$2" -eq 0 ]; then echo "whole app: $1 pass"; else echo "whole app: $1 FAIL"; failed=1; fi; }
          wait_for() {
            for _ in $(seq 1 "$2"); do
              grep -qE "$1" "$log" 2> /dev/null && return 0
              sleep 0.5
            done
            return 1
          }
          perl -e 'alarm shift; exec @ARGV' 240 open -n -W --stdout "$folder/app.out" --stderr "$folder/app.err" "$app" --args --settings "$folder/settings.json" &
          opener=$!
          wait_for 'capture started:' 120; check "capture started" $?
          pid=$(pgrep -f 'Hindsound.app/Contents/MacOS/hindsound --settings' | head -n 1)
          echo "whole app: pid ${pid:-none}"
          perl -e 'alarm shift; exec @ARGV' 30 afplay "$folder/tone.wav" &
          player=$!
          sleep 11
          [ -n "$pid" ] && echo "whole app: resident memory while capturing $(ps -o rss= -p "$pid" | tr -d ' ') KB (ps)"
          code=0
          perl -e 'alarm shift; exec @ARGV' 30 "$program" --settings "$folder/settings.json" --save || code=$?
          echo "--save from a second launch: exit code $code (2: handed to the running instance)"
          [ "$code" -eq 2 ]; check "--save handed over" $?
          wait_for 'clip saved:|clip not saved:' 60; check "clip saved line" $?
          wait_for 'notification (Saved|Partial|WavFallback):' 20; check "notification shown" $?
          clip=$(find "$clips" -maxdepth 1 -name '*.mp3' | head -n 1)
          echo "whole app: clip '${clip:-none}', $(stat -f %z "$clip" 2> /dev/null || echo 0) bytes"
          [ -n "$clip" ] && [ -s "$clip" ]; check "clip written in the folder of the settings" $?
          if [ -n "$clip" ]; then
            afinfo "$clip" | sed 's/^/  afinfo: /'
            afconvert -f WAVE -d LEI16 "$clip" "$folder/clip.wav"; check "clip decoded" $?
            python3 - "$folder/clip.wav" <<'PY'; check "1 kHz in the clip" $?
          import array, math, sys, wave
          with wave.open(sys.argv[1], 'rb') as f:
              rate, channels = f.getframerate(), f.getnchannels()
              data = array.array('h', f.readframes(f.getnframes()))
          left = [data[i] / 32768.0 for i in range(0, len(data), channels)]
          print(f"clip: {len(left) / rate:.2f} s at {rate} Hz, {channels} channels")
          def level(samples, hz):
              w = 2 * math.pi * hz / rate
              k = 2 * math.cos(w)
              s1 = s2 = 0.0
              for x in samples:
                  s1, s2 = x + k * s1 - s2, s1
              power = s1 * s1 + s2 * s2 - k * s1 * s2
              return 20 * math.log10(max(1e-12, 2 * math.sqrt(max(0.0, power)) / len(samples)))
          # The loudest second: the tone plays in the last part of the clip, after the silence before afplay.
          seconds = [left[i:i + rate] for i in range(0, len(left) - rate + 1, rate)]
          best = max(seconds, key=lambda s: sum(x * x for x in s))
          rms = 20 * math.log10(max(1e-12, math.sqrt(sum(x * x for x in best) / len(best))))
          peak = 20 * math.log10(max(1e-12, max(abs(x) for x in best)))
          a1000, a440, a2000 = level(best, 1000), level(best, 440), level(best, 2000)
          # A pure sine of amplitude A has a RMS of A/sqrt(2): its Goertzel amplitude in dBFS is the RMS plus 3 dB.
          print(f"clip: loudest second rms={rms:.1f}dBFS peak={peak:.1f}dBFS a1000={a1000:.1f}dBFS a440={a440:.1f}dBFS a2000={a2000:.1f}dBFS")
          sys.exit(0 if rms > -40 and a1000 > rms and a1000 - a440 > 30 and a1000 - a2000 > 30 else 1)
          PY
            pasted=$(osascript -l JavaScript -e 'ObjC.import("AppKit"); ObjC.unwrap($.NSPasteboard.generalPasteboard.stringForType("public.file-url"))' 2>&1)
            echo "whole app: pasteboard file URL '$pasted'"
            python3 - "$pasted" "$clip" <<'PY'; check "pasteboard holds the URL of the clip" $?
          import os, sys, urllib.parse
          url = urllib.parse.urlparse(sys.argv[1])
          sys.exit(0 if url.scheme == 'file' and os.path.realpath(urllib.parse.unquote(url.path)) == os.path.realpath(sys.argv[2]) else 1)
          PY
          fi
          [ -n "$pid" ] && echo "whole app: resident memory after the clip $(ps -o rss= -p "$pid" | tr -d ' ') KB (ps)"
          wait "$player" || true
          if [ -n "$pid" ]; then
            kill -TERM "$pid"; check "SIGTERM sent" $?
          fi
          opener_code=0
          wait "$opener" || opener_code=$?
          echo "whole app: open ended with code $opener_code"
          pgrep -f 'Hindsound.app/Contents/MacOS/hindsound --settings' > /dev/null && { echo "whole app: still running"; pkill -KILL -f 'Hindsound.app/Contents/MacOS/hindsound --settings'; failed=1; }
          cat "$folder/app.out" "$folder/app.err" 2> /dev/null | sed 's/^/  console: /' || true
          sed 's/^/  log whole: /' "$log" || true
          grep -q 'leaving with exit code 0' "$log"; check "the app left with exit code 0" $?
          exit $failed

      # "hindsound --save" with no Hindsound running, from the shell as Terminal or the Shortcuts app would run it: the
      # program must start its bundle through open (Launch Services) and leave, so that the app is not a child of the shell
      # (macOS would ask the shell for the permissions, and the app would end with it). The app that starts is a child of
      # launchd, its parent pid 1; SIGTERM ends it, and its log gives its exit code.
      - name: Start the app from --save when none is running
        if: ${{ !cancelled() && steps.unpack.outcome == 'success' }}
        run: |
          app="$RUNNER_TEMP/app/Hindsound.app"
          program="$app/Contents/MacOS/hindsound"
          folder="$RUNNER_TEMP/mac-save-start"
          log="$folder/settings.log"
          mkdir -p "$folder/clips"
          printf '{"audio":{"micDeviceId":"disabled"},"export":{"outputFolder":"%s","copyToClipboard":false},"general":{"startWithWindows":false}}\n' "$folder/clips" > "$folder/settings.json"
          set +e
          failed=0
          check() { if [ "$2" -eq 0 ]; then echo "save start: $1 pass"; else echo "save start: $1 FAIL"; failed=1; fi; }
          running() { pgrep -f 'Hindsound.app/Contents/MacOS/hindsound --settings' | head -n 1; }
          [ -z "$(running)" ]; check "no Hindsound running before" $?
          code=0
          perl -e 'alarm shift; exec @ARGV' 30 "$program" --settings "$folder/settings.json" --save || code=$?
          echo "save start: --save with no running instance ended with code $code"
          [ "$code" -eq 0 ]; check "--save left with code 0" $?
          pid=""
          for _ in $(seq 1 60); do
            pid=$(running)
            [ -n "$pid" ] && break
            sleep 0.5
          done
          parent=$([ -n "$pid" ] && ps -o ppid= -p "$pid" | tr -d ' ')
          echo "save start: pid ${pid:-none}, parent pid ${parent:-none}, command $([ -n "$pid" ] && ps -o command= -p "$pid")"
          [ -n "$pid" ]; check "the app runs after --save" $?
          [ "$parent" = 1 ]; check "the app is a child of launchd, not of the shell" $?
          grep -q 'through Launch Services (open)' "$log"; check "the log says --save went through open" $?
          sleep 5
          [ -n "$pid" ] && kill -TERM "$pid"
          for _ in $(seq 1 40); do
            [ -z "$(running)" ] && break
            sleep 0.5
          done
          [ -n "$(running)" ] && { echo "save start: still running"; pkill -KILL -f 'Hindsound.app/Contents/MacOS/hindsound --settings'; failed=1; }
          sed 's/^/  log save start: /' "$log" || true
          grep -q 'leaving with exit code 0' "$log"; check "the app left with exit code 0" $?
          exit $failed

      - name: Keep the pages of the window
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-dump-${{ matrix.os }}
          path: ${{ runner.temp }}/mac-dump/
          if-no-files-found: warn

  # The capture of one application, on each sound server a desktop runs: PulseAudio, and PipeWire through pipewire-pulse
  # (Ubuntu 24.04: PipeWire 1.0). The job above runs these tests on PulseAudio among all the others; here they run alone, with
  # their measures in the log. PipeWire is started by hand, with no desktop, as a session starts it: pipewire, wireplumber,
  # then pipewire-pulse. Its logs are printed when a test fails.
  app-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server: [pulseaudio, pipewire]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install the sound server and a session bus
        env:
          SERVER: ${{ matrix.server }}
        run: |
          sudo apt-get update
          if [ "$SERVER" = pipewire ]; then
            sudo apt-get install -y --no-install-recommends dbus pipewire pipewire-bin pipewire-pulse wireplumber pulseaudio-utils
          else
            sudo apt-get install -y --no-install-recommends dbus pulseaudio pulseaudio-utils
          fi

      - name: Build
        run: dotnet build tests/Hindsound.Linux.Tests/Hindsound.Linux.Tests.csproj -c Release

      - name: Test the capture of one application
        env:
          SERVER: ${{ matrix.server }}
          SERVER_LOGS: ${{ runner.temp }}/server-logs
        run: |
          mkdir -p "$SERVER_LOGS"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -uc '
            if [ "$SERVER" = pipewire ]; then
              pipewire > "$SERVER_LOGS/pipewire.log" 2>&1 &
              sleep 2
              wireplumber > "$SERVER_LOGS/wireplumber.log" 2>&1 &
              sleep 2
              pipewire-pulse > "$SERVER_LOGS/pipewire-pulse.log" 2>&1 &
            else
              pulseaudio --daemonize=yes --exit-idle-time=-1 --log-target="file:$SERVER_LOGS/pulseaudio.log"
            fi
            for attempt in $(seq 1 40); do pactl info > /dev/null 2>&1 && break; sleep 0.5; done
            pactl info | grep -E "Server (Name|Version)"
            pactl load-module module-null-sink sink_name=hindsound_null
            pactl set-default-sink hindsound_null
            dotnet test tests/Hindsound.Linux.Tests/Hindsound.Linux.Tests.csproj -c Release --no-build \
              --filter "FullyQualifiedName~PulseAppCaptureOnLinuxTests" --logger "console;verbosity=detailed" \
              || { tail -n 60 "$SERVER_LOGS"/*.log; exit 1; }
          '

  # Until a release builds them, the files of the rehearsal below carry the version of the latest release in the changelog.
  release-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          version=$(grep -m 1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # A rehearsal of the release, with nothing published: every file a tag would attach (the Setup, the portable zip, the
  # AppImage, the tar.gz, the manifests, SHA256SUMS, the LAME source and the source of libfuse, of the AppImage runtime
  # and of the other libraries linked into it), built and checked by the very workflow the tag runs, and kept as artifacts
  # of the run:
  # hindsound-windows-x64, hindsound-linux-x64, hindsound-macos-arm64 and release-files. It passes no secret: the Mac app
  # of the rehearsal is signed ad hoc, and a throwaway certificate signs a copy.
  release-files:
    needs: release-version
    uses: ./.github/workflows/release-files.yml
    with:
      version: ${{ needs.release-version.outputs.version }}
