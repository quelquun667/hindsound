name: Release files

# Builds and checks every file of a release, and publishes nothing: it has no token that could. release.yml calls it on a
# tag, then attaches the files it made to the draft; ci.yml calls it on every pull request, so that a pull request builds
# exactly what a tag will. The files are kept as the artifact release-files of the run.
on:
  workflow_call:
    inputs:
      version:
        description: The version X.Y.Z, in the names of the files, in the programs and in the manifests.
        required: true
        type: string
    # Only release.yml passes them, and only to the step that signs the Mac app. Without them, the Mac app is signed ad hoc.
    secrets:
      MACOS_SIGNING_P12:
        description: The certificate that signs the Mac app and its key, a .p12 in base64 (packaging/mac/make-signing-certificate.sh).
        required: false
      MACOS_SIGNING_P12_PASSWORD:
        description: The password of that .p12.
        required: false

permissions:
  contents: read

jobs:
  # The Setup and the portable zip, from one published folder: the same exe and the same compiled DLL in both.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # prove-encoding.ps1 runs tests of this project with --no-build, with the compiled DLL put in their output folder.
      - name: Build the tests
        run: dotnet build tests/Hindsound.Tests/Hindsound.Tests.csproj -c Release

      - name: Publish the app
        run: dotnet publish src/Hindsound/Hindsound.csproj -p:PublishProfile=win-x64 "-p:Version=$env:VERSION" "-p:PublishDir=$env:RUNNER_TEMP/publish/"

      # The published folder still holds the DLL of the NAudio.Lame package here: the exports are compared with it.
      - name: Build LAME
        timeout-minutes: 15
        run: ./tools/release/build-lame.ps1 -WorkDir "$env:RUNNER_TEMP/lame" -OutFile "$env:RUNNER_TEMP/lame/libmp3lame.64.dll" -ReferenceDll "$env:RUNNER_TEMP/publish/libmp3lame.64.dll"

      - name: Replace the DLL in the published folder
        run: Copy-Item -LiteralPath "$env:RUNNER_TEMP/lame/libmp3lame.64.dll" -Destination "$env:RUNNER_TEMP/publish/libmp3lame.64.dll" -Force

      - name: Prove the encoding with the compiled DLL
        timeout-minutes: 10
        run: ./tools/release/prove-encoding.ps1 -DllPath "$env:RUNNER_TEMP/lame/libmp3lame.64.dll" -ResultsDir "$env:RUNNER_TEMP/encoding-results"

      - name: Build the Setup
        run: |
          $iscc = ./tools/release/get-iscc.ps1 -Destination "$env:RUNNER_TEMP/inno"
          & $iscc /Q "/DMyAppVersion=$env:VERSION" "/DPublishDir=$env:RUNNER_TEMP/publish" "/O$env:RUNNER_TEMP/out" "/FHindsound-$env:VERSION-Setup" installer/Hindsound.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the Setup
        timeout-minutes: 15
        run: ./tools/release/check-setup.ps1 -SetupPath "$env:RUNNER_TEMP/out/Hindsound-$env:VERSION-Setup.exe" -Version $env:VERSION -DllPath "$env:RUNNER_TEMP/lame/libmp3lame.64.dll" -WorkDir "$env:RUNNER_TEMP/setup-check"

      - name: Write the update manifest
        run: ./tools/release/write-manifest.ps1 -Version $env:VERSION -SetupPath "$env:RUNNER_TEMP/out/Hindsound-$env:VERSION-Setup.exe" -Repository $env:GITHUB_REPOSITORY -OutFile "$env:RUNNER_TEMP/out/hindsound-update-win-x64.json"

      - name: Make the portable zip
        run: ./tools/release/build-portable-zip.ps1 -PublishDir "$env:RUNNER_TEMP/publish" -Version $env:VERSION -OutFile "$env:RUNNER_TEMP/out/Hindsound-$env:VERSION-win-x64-portable.zip"

      # The LGPL source of LAME goes with every release, as verified by build-lame.ps1.
      - name: Add the LAME source
        run: Copy-Item -LiteralPath "$env:RUNNER_TEMP/lame/lame-3.100.tar.gz" -Destination "$env:RUNNER_TEMP/out/lame-3.100.tar.gz"

      - name: Keep the Windows files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hindsound-windows-x64
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          overwrite: true

  # The Linux app, published as the users get it: one self-contained, trimmed file, with its MP3 encoder, its window library
  # and its fonts, made into an AppImage and a tar.gz. Built on the oldest Ubuntu the runners offer, so that it runs on the
  # newer ones; the program of both packages is started (--prove-mp3, then --dump-settings).
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      HINDSOUND_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Publish the Linux app
        run: >-
          dotnet publish src/Hindsound.Linux/Hindsound.Linux.csproj -c Release -r linux-x64 --self-contained
          -p:PublishSingleFile=true -p:PublishTrimmed=true "-p:Version=$HINDSOUND_VERSION"
          "-p:PublishDir=$RUNNER_TEMP/hindsound-linux-x64/"

      # The same LAME 3.100 as the Windows build, compiled here; it leaves libmp3lame.so.0 (and the lame command of the
      # tests, which is not shipped) in its second folder.
      - name: Build the MP3 encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl file binutils
          bash tools/release/build-lame-linux.sh "$RUNNER_TEMP/lame-work" "$RUNNER_TEMP/lame"

      # A release, like the rehearsal of every pull request, builds SDL3 and fetches the fonts afresh, each checked against
      # the pins of its script: no cache, no step that a ref could skip.
      #
      # SDL 3.2.30 from its source, which the script verifies, with X11, Wayland, the input methods and nothing of SDL's
      # audio: Ubuntu 22.04 and 24.04 have no SDL3 package.
      - name: Build the window library
        run: |
          sudo apt-get install -y --no-install-recommends $(bash tools/linux/build-sdl3.sh --packages)
          bash tools/linux/build-sdl3.sh "$RUNNER_TEMP/sdl3-work" "$RUNNER_TEMP/sdl3"

      - name: Check the window library
        run: bash tools/linux/build-sdl3.sh --check "$RUNNER_TEMP/sdl3"

      - name: Fetch the fonts of the window
        run: bash tools/linux/fetch-fonts.sh "$RUNNER_TEMP/fonts-work" "$RUNNER_TEMP/fonts"

      - name: Check the fonts of the window
        run: bash tools/linux/fetch-fonts.sh --check "$RUNNER_TEMP/fonts"

      # The checker of desktop entries, and the text libraries the window takes from the system, for the check of the
      # packages: they are not shipped.
      - name: Install the checker of desktop entries and the text libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils libfreetype6 libharfbuzz0b libfontconfig1

      - name: Make the AppImage and the tar.gz
        run: >-
          bash packaging/linux/build-packages.sh "$RUNNER_TEMP/hindsound-linux-x64" "$RUNNER_TEMP/lame/libmp3lame.so.0"
          "$RUNNER_TEMP/sdl3/libSDL3.so.0" "$RUNNER_TEMP/fonts" "$HINDSOUND_VERSION" "$RUNNER_TEMP/packages"

      - name: Check the packages
        run: bash packaging/linux/check-packages.sh "$RUNNER_TEMP/packages" "$HINDSOUND_VERSION"

      # The Debian package, from the same inputs, made a second time elsewhere: the same commit gives the same bytes. It adds
      # its line to the SHA256SUMS of the other two.
      - name: Make the .deb
        run: |
          bash packaging/linux/build-deb.sh "$RUNNER_TEMP/hindsound-linux-x64" "$RUNNER_TEMP/lame/libmp3lame.so.0" "$RUNNER_TEMP/sdl3/libSDL3.so.0" "$RUNNER_TEMP/fonts" "$HINDSOUND_VERSION" "$RUNNER_TEMP/packages"
          bash packaging/linux/build-deb.sh "$RUNNER_TEMP/hindsound-linux-x64" "$RUNNER_TEMP/lame/libmp3lame.so.0" "$RUNNER_TEMP/sdl3/libSDL3.so.0" "$RUNNER_TEMP/fonts" "$HINDSOUND_VERSION" "$RUNNER_TEMP/deb-again"
          cmp -- "$RUNNER_TEMP/packages/hindsound_${HINDSOUND_VERSION}_amd64.deb" "$RUNNER_TEMP/deb-again/hindsound_${HINDSOUND_VERSION}_amd64.deb"
          (cd "$RUNNER_TEMP/packages" && sha256sum --check --strict SHA256SUMS)

      # Its fields, its files, what its programs link against its Depends, and lintian, without error or unexplained warning.
      - name: Check the .deb
        run: |
          sudo apt-get install -y --no-install-recommends lintian
          bash packaging/linux/check-deb.sh "$RUNNER_TEMP/packages" "$HINDSOUND_VERSION"

      # The packages ship libmp3lame.so.0 under the LGPL: its source goes with them, the archive the encoder was built from,
      # which build-lame-linux.sh verified against the SHA-256 of the notices. SDL3 (zlib licence) and the fonts (SIL Open
      # Font License) ask for no source to go with them: their licence texts are in the packages.
      - name: Add the LAME source
        run: cp -- "$RUNNER_TEMP/lame-work/lame-3.100.tar.gz" "$RUNNER_TEMP/packages/"

      # The runtime at the head of the AppImage is statically linked with libfuse, under the LGPL-2.1: the source of both
      # goes with the AppImage, fuse-3.15.0.tar.xz and the runtime at its tag, with the source of every other library linked
      # into the runtime (squashfuse and the Alpine packages of Zstandard, zlib, mimalloc and musl), each file checked against
      # the pins of the script.
      - name: Add the source of the AppImage runtime
        run: bash tools/release/fetch-runtime-sources.sh "$RUNNER_TEMP/runtime-sources-work" "$RUNNER_TEMP/packages"

      # A zip of the artifact drops the executable bit: the README says to give it back to the AppImage.
      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hindsound-linux-x64
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
          overwrite: true

  # The .deb installed by apt in clean containers of the systems it is for, with its Depends alone, then started by
  # /usr/bin/hindsound (--prove-mp3, then --dump-settings) and removed. The release job of release.yml waits for every job
  # of this workflow: a .deb that does not install on one of them stops the release.
  deb:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'debian:13']
    container:
      image: ${{ matrix.image }}
    env:
      HINDSOUND_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A path in the workspace: inside a container, runner.temp names a folder of the host.
      - name: Take the Linux files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hindsound-linux-x64
          path: linux-files

      - name: Install, run and remove the .deb
        run: bash packaging/linux/try-deb.sh linux-files "$HINDSOUND_VERSION"

  # The Mac app for Apple silicon, Hindsound.app in a zip made by ditto. Its four native libraries are built from their
  # pinned sources and its fonts fetched, afresh, as for Linux: no cache. The app is signed by the certificate of the
  # repository when release.yml passes the secret MACOS_SIGNING_P12, ad hoc otherwise, with a warning in the log. The zip is
  # then unzipped elsewhere and its program started (--prove-mp3, then --dump-settings), as the .deb is tried. Last, a
  # throwaway certificate made by make-signing-certificate.sh signs a copy, so the path of the certificate is proven before
  # the secret exists.
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HINDSOUND_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # SDL3, FreeType, HarfBuzz and LAME, each archive checked against its pin before it is read, then each dylib checked.
      - name: Build the native libraries
        timeout-minutes: 30
        run: bash tools/mac/build-natives.sh "$RUNNER_TEMP/natives-work" "$RUNNER_TEMP/natives"

      # The font script of Linux calls sha256sum, which macOS may not have: the same digest through shasum.
      - name: Give the font script a sha256sum
        run: |
          if ! command -v sha256sum > /dev/null; then
            mkdir -p "$RUNNER_TEMP/bin"
            printf '#!/bin/sh\nexec shasum -a 256 "$@"\n' > "$RUNNER_TEMP/bin/sha256sum"
            chmod +x "$RUNNER_TEMP/bin/sha256sum"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch the fonts of the window
        run: bash tools/linux/fetch-fonts.sh "$RUNNER_TEMP/fonts-work" "$RUNNER_TEMP/fonts"

      - name: Check the fonts of the window
        run: bash tools/linux/fetch-fonts.sh --check "$RUNNER_TEMP/fonts"

      # The .p12 goes to a folder of its own, removed when the step ends; sign-app.sh deletes its keychain itself.
      - name: Assemble and sign Hindsound.app
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -n "$MACOS_SIGNING_P12" ]; then
            signing="$(mktemp -d)"
            trap 'rm -rf "$signing"' EXIT
            printf '%s' "$MACOS_SIGNING_P12" | base64 --decode > "$signing/signing.p12"
            export HINDSOUND_SIGNING_P12="$signing/signing.p12" HINDSOUND_SIGNING_P12_PASSWORD="$MACOS_SIGNING_P12_PASSWORD"
            echo "Hindsound.app is signed by the certificate of the secret MACOS_SIGNING_P12."
          else
            echo "::warning title=Mac app signed ad hoc::No secret MACOS_SIGNING_P12: Hindsound.app is signed ad hoc, and macOS will ask again for the permissions (sound of the system, microphone) after each update. tools/release/README.md says how to make the certificate."
          fi
          bash packaging/mac/build-app.sh "$RUNNER_TEMP/natives" "$RUNNER_TEMP/fonts" "$RUNNER_TEMP/app" "$HINDSOUND_VERSION"

      # Without the extended attributes and resource forks of the build machine: the zip holds Hindsound.app alone.
      - name: Make the zip
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          ditto -c -k --norsrc --noextattr --noqtn --keepParent "$RUNNER_TEMP/app/Hindsound.app" "$RUNNER_TEMP/out/Hindsound-$HINDSOUND_VERSION-macos-arm64.zip"

      - name: Check the zip
        timeout-minutes: 15
        run: bash packaging/mac/check-zip.sh "$RUNNER_TEMP/out/Hindsound-$HINDSOUND_VERSION-macos-arm64.zip" "$HINDSOUND_VERSION" "$RUNNER_TEMP/zip-check"

      # The commands of tools/release/README.md, with a certificate made here and thrown away: the base64 file goes back to a
      # .p12 as the secret does, and signs a copy of the app.
      - name: Rehearse the signing with a throwaway certificate
        run: |
          certificate="$RUNNER_TEMP/throwaway-certificate"
          bash packaging/mac/make-signing-certificate.sh "$certificate"
          base64 --decode -i "$certificate/hindsound-signing.p12.base64" -o "$certificate/from-secret.p12"
          ditto "$RUNNER_TEMP/app/Hindsound.app" "$RUNNER_TEMP/rehearsal/Hindsound.app"
          HINDSOUND_SIGNING_P12="$certificate/from-secret.p12" HINDSOUND_SIGNING_P12_PASSWORD="$(cat "$certificate/password.txt")" \
            bash packaging/mac/sign-app.sh "$RUNNER_TEMP/rehearsal/Hindsound.app"
          rm -rf "$certificate" "$RUNNER_TEMP/rehearsal"

      - name: Keep the Mac files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hindsound-macos-arm64
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          overwrite: true

  # The files of the release, together: the three announce manifests and one SHA256SUMS are written here, then everything
  # is checked as the release job checks the files it downloads back from the draft.
  assemble:
    needs: [windows, linux, macos]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the Windows files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hindsound-windows-x64
          path: ${{ runner.temp }}/windows

      - name: Take the Linux files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hindsound-linux-x64
          path: ${{ runner.temp }}/linux

      - name: Take the Mac files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hindsound-macos-arm64
          path: ${{ runner.temp }}/macos

      - name: Gather the files of the release
        run: ./tools/release/assemble-release.ps1 -Version $env:VERSION -Repository $env:GITHUB_REPOSITORY -WindowsFolder "$env:RUNNER_TEMP/windows" -LinuxFolder "$env:RUNNER_TEMP/linux" -MacFolder "$env:RUNNER_TEMP/macos" -OutFolder "$env:RUNNER_TEMP/release"

      - name: Check the files of the release
        run: ./tools/release/check-release-files.ps1 -Folder "$env:RUNNER_TEMP/release" -Version $env:VERSION -Repository $env:GITHUB_REPOSITORY

      - name: Keep the files of the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          overwrite: true
