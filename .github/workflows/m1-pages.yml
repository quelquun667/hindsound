name: m1-pages

# Temporary: the pages of the Linux app drawn off screen by the exe of the base of this branch and by the exe of the
# branch, at the scales 1 and 1.5, compared byte for byte. Removed before the branch is merged.
on:
  push:
    branches: [agent/mac-m1]

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install the text libraries, build SDL3, fetch the fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfreetype6 libharfbuzz0b libfontconfig1 fontconfig fonts-droid-fallback
          sudo apt-get install -y --no-install-recommends $(bash tools/linux/build-sdl3.sh --packages)
          bash tools/linux/build-sdl3.sh "$RUNNER_TEMP/sdl3-work" "$RUNNER_TEMP/sdl3"
          bash tools/linux/build-sdl3.sh --check "$RUNNER_TEMP/sdl3"
          bash tools/linux/fetch-fonts.sh "$RUNNER_TEMP/fonts-work" "$RUNNER_TEMP/fonts"
          bash tools/linux/fetch-fonts.sh --check "$RUNNER_TEMP/fonts"

      - name: Publish the base and the branch
        run: |
          base=$(git merge-base HEAD origin/main)
          echo "base: $base, branch: $(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/base-src" && git archive "$base" | tar -x -C "$RUNNER_TEMP/base-src"
          for side in base branch; do
            if [ "$side" = base ]; then src="$RUNNER_TEMP/base-src"; else src="$GITHUB_WORKSPACE"; fi
            dotnet publish "$src/src/Hindsound.Linux/Hindsound.Linux.csproj" -c Release -r linux-x64 --self-contained \
              -p:PublishSingleFile=true -p:PublishTrimmed=true -p:Version=0.10.1 "-p:PublishDir=$RUNNER_TEMP/$side/"
            cp "$RUNNER_TEMP/sdl3/libSDL3.so.0" "$RUNNER_TEMP/$side/"
            echo "$side publish:"; ls -la "$RUNNER_TEMP/$side"
            echo "$side bundle names Hindsound.Unix.dll: $(grep -c -a 'Hindsound.Unix.dll' "$RUNNER_TEMP/$side/hindsound" || true)"
          done

      # The same settings path for every run, and the clock started at the same instant (libfaketime, the monotonic
      # clock left alone): a page that shows the time or a path then draws the same thing. base2 is a second run of
      # the base, the control that the drawing itself is repeatable.
      - name: Draw the pages with both and compare them
        run: |
          sudo apt-get install -y --no-install-recommends faketime
          failed=0
          for scale in 1 1.5; do
            for side in base branch base2; do
              # The same path for both exes: the keyboard pages show the command of the program, its path included.
              rm -rf "$RUNNER_TEMP/app" && cp -r "$RUNNER_TEMP/${side%2}" "$RUNNER_TEMP/app"
              exe="$RUNNER_TEMP/app/hindsound"
              run="$RUNNER_TEMP/run"
              rm -rf "$run" && mkdir -p "$run/png"
              printf '%s\n' '{"audio":{"micDeviceId":"disabled"}}' > "$run/settings.json"
              code=0
              DONT_FAKE_MONOTONIC=1 HINDSOUND_FONT_DIR="$RUNNER_TEMP/fonts" SDL_VIDEO_DRIVER=offscreen timeout 300 \
                faketime -f '@2026-11-21 12:00:00' "$exe" \
                --settings "$run/settings.json" --no-mic --no-clipboard --no-hotkeys --offscreen \
                --dump-settings "$run/png" --scale "$scale" || code=$?
              echo "$side at $scale: exit code $code, $(ls "$run/png" | grep -c '\.png$') PNG files"
              [ "$code" -eq 0 ] || failed=1
              mv "$run" "$RUNNER_TEMP/run-$side-$scale"
            done
            for pair in "base base2" "base branch"; do
              set -- $pair
              a="$RUNNER_TEMP/run-$1-$scale/png"
              b="$RUNNER_TEMP/run-$2-$scale/png"
              count=$(ls "$a" | grep -c '\.png$')
              if [ "$count" -gt 0 ] && diff -r "$a" "$b"; then
                echo "scale $scale, $1 and $2: the $count PNG files are identical byte for byte"
                (cd "$a" && sha256sum *.png | sha256sum | sed "s/^/scale $scale, $1: digest of the list: /")
                (cd "$b" && sha256sum *.png | sha256sum | sed "s/^/scale $scale, $2: digest of the list: /")
              else
                echo "scale $scale, $1 and $2: the pages differ"
                failed=1
              fi
            done
          done
          exit $failed
